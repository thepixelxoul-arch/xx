<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>লগইন ও সাইন আপ - আমার দারাজ</title>
    <link rel="stylesheet" href="style.css">
    
    <style>
        .auth-container { max-width: 420px; margin: 50px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .auth-tabs { display: flex; justify-content: space-around; margin-bottom: 20px; border-bottom: 2px solid #e0e0e0; }
        .auth-tabs h3 { padding: 10px 20px; cursor: pointer; color: #777; font-size: 18px; transition: 0.3s; }
        .auth-tabs h3.active { color: #f85606; border-bottom: 3px solid #f85606; margin-bottom: -2px; }
        
        .auth-form { display: flex; flex-direction: column; }
        .auth-form input { padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; outline: none; font-size: 14px; }
        .auth-form input:focus { border-color: #f85606; box-shadow: 0 0 5px rgba(248, 86, 6, 0.2); }
        
        .auth-btn { background-color: #f85606; color: white; border: none; padding: 12px; cursor: pointer; border-radius: 4px; font-weight: bold; font-size: 16px; transition: 0.3s; }
        .auth-btn:hover { background-color: #d84a05; }
        
        #signup-form { display: none; }
    </style>
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="logo">
            <a href="index.html" style="color: white; text-decoration: none;">AmarDaraz</a>
        </div>
    </nav>

    <!-- Login / Signup Box -->
    <div class="auth-container">
        <div class="auth-tabs">
            <h3 id="tab-login" class="active" onclick="switchTab('login')">লগইন</h3>
            <h3 id="tab-signup" onclick="switchTab('signup')">সাইন আপ</h3>
        </div>

        <!-- Login Form -->
        <form id="login-form" class="auth-form">
            <input type="email" id="login-email" placeholder="আপনার ইমেইল অ্যাড্রেস" required>
            <input type="password" id="login-password" placeholder="পাসওয়ার্ড" required>
            <button type="submit" class="auth-btn" id="login-btn">লগইন করুন</button>
        </form>

        <!-- Signup Form -->
        <form id="signup-form" class="auth-form">
            <input type="text" id="signup-name" placeholder="আপনার সম্পূর্ণ নাম" required>
            <input type="email" id="signup-email" placeholder="ইমেইল অ্যাড্রেস" required>
            <input type="password" id="signup-password" placeholder="নতুন পাসওয়ার্ড দিন (অন্তত ৬ অক্ষর)" required>
            <button type="submit" class="auth-btn" id="signup-btn">অ্যাকাউন্ট খুলুন</button>
        </form>
    </div>

    <!-- UI Tab Switcher -->
    <script>
        function switchTab(tab) {
            document.getElementById('login-form').style.display = tab === 'login' ? 'flex' : 'none';
            document.getElementById('signup-form').style.display = tab === 'signup' ? 'flex' : 'none';
            document.getElementById('tab-login').className = tab === 'login' ? 'active' : '';
            document.getElementById('tab-signup').className = tab === 'signup' ? 'active' : '';
        }
    </script>

    <!-- Firebase Authentication Javascript -->
    <script type="module">
        // Firebase SDKs (Version 12.17.1)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-analytics.js";
        // Authentication এর জন্য প্রয়োজনীয় SDK যুক্ত করা হলো
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

        // আপনার দেওয়া Firebase কনফিগারেশন
        const firebaseConfig = {
            apiKey: "AIzaSyBZNrrK7MLGIZoPakMgj2yFEX7iCVYYhlg",
            authDomain: "amrdraz-d0682.firebaseapp.com",
            projectId: "amrdraz-d0682",
            storageBucket: "amrdraz-d0682.firebasestorage.app",
            messagingSenderId: "690289096145",
            appId: "1:690289096145:web:dbebaa4e60203a7922dcf0",
            measurementId: "G-XX7GVSTTCH"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const auth = getAuth(app);

        // সাইন আপ (Sign Up) ফাংশন
        document.getElementById('signup-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('signup-email').value;
            const password = document.getElementById('signup-password').value;
            const btn = document.getElementById('signup-btn');
            
            btn.innerText = "অ্যাকাউন্ট তৈরি হচ্ছে...";

            createUserWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    alert("🎉 সফলভাবে অ্যাকাউন্ট তৈরি হয়েছে!");
                    window.location.href = "index.html"; 
                })
                .catch((error) => {
                    alert("সমস্যা হয়েছে: " + error.message);
                    btn.innerText = "অ্যাকাউন্ট খুলুন";
                });
        });

        // লগইন (Login) ফাংশন
        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const btn = document.getElementById('login-btn');
            
            btn.innerText = "লগইন হচ্ছে...";

            signInWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    alert("✅ লগইন সফল হয়েছে!");
                    window.location.href = "index.html"; 
                })
                .catch((error) => {
                    alert("ইমেইল বা পাসওয়ার্ড ভুল হয়েছে!");
                    btn.innerText = "লগইন করুন";
                });
        });
    </script>
</body>
</html>
