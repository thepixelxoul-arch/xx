<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>লগইন / সাইন-আপ - আমার দারাজ</title>
    
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background-color: #f4f4f6; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
        }
        
        .auth-container { 
            background: white; 
            padding: 40px 30px; 
            border-radius: 8px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 400px; 
            text-align: center; 
        }
        
        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #f85606;
            margin-bottom: 25px;
            text-decoration: none;
            display: inline-block;
        }

        /* Tabs for Login & Signup */
        .tab-container {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 2px solid #eee;
        }
        .tab-btn {
            flex: 1;
            padding: 10px;
            background: none;
            border: none;
            font-size: 16px;
            font-weight: bold;
            color: #777;
            cursor: pointer;
            transition: 0.3s;
        }
        .tab-btn.active {
            color: #f85606;
            border-bottom: 2px solid #f85606;
        }

        /* Form Design */
        .form-section { display: none; animation: fadeIn 0.3s; }
        .form-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; margin-bottom: 5px; color: #333; font-weight: bold; font-size: 14px; }
        .input-group input { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid #ccc; 
            border-radius: 4px; 
            box-sizing: border-box; 
            font-size: 15px; 
            outline: none; 
            transition: 0.3s; 
        }
        .input-group input:focus { border-color: #f85606; box-shadow: 0 0 5px rgba(248, 86, 6, 0.3); }
        
        /* 🌟 Forgot Password Link */
        .forgot-pass { text-align: right; margin-bottom: 20px; }
        .forgot-pass a { color: #f85606; text-decoration: none; font-size: 13px; font-weight: bold; transition: 0.3s; }
        .forgot-pass a:hover { text-decoration: underline; color: #d84a05; }

        .auth-btn { 
            background-color: #f85606; 
            color: white; 
            border: none; 
            padding: 14px; 
            width: 100%; 
            border-radius: 4px; 
            font-weight: bold; 
            font-size: 16px; 
            cursor: pointer; 
            transition: 0.3s; 
        }
        .auth-btn:hover { background-color: #d84a05; }
        
        #message { margin-top: 15px; font-size: 14px; font-weight: bold; display: none; padding: 10px; border-radius: 4px; }
    </style>
</head>
<body>

    <div class="auth-container">
        <a href="index.html" class="logo">AmarDaraz</a>
        
        <!-- Tabs -->
        <div class="tab-container">
            <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">লগইন</button>
            <button class="tab-btn" id="tab-signup" onclick="switchTab('signup')">সাইন-আপ</button>
        </div>
        
        <!-- Login Form -->
        <div id="login-section" class="form-section active">
            <form id="login-form">
                <div class="input-group">
                    <label>ইমেইল আইডি</label>
                    <input type="email" id="login-email" placeholder="example@gmail.com" required>
                </div>
                <div class="input-group">
                    <label>পাসওয়ার্ড</label>
                    <input type="password" id="login-password" placeholder="আপনার পাসওয়ার্ড দিন" required>
                </div>
                
                <!-- 🌟 ফোরগেট পাসওয়ার্ড অপশন -->
                <div class="forgot-pass">
                    <a href="forgot-password.html">পাসওয়ার্ড ভুলে গেছেন?</a>
                </div>
                
                <button type="submit" class="auth-btn" id="login-btn">লগইন করুন</button>
            </form>
        </div>

        <!-- Signup Form -->
        <div id="signup-section" class="form-section">
            <form id="signup-form">
                <div class="input-group">
                    <label>আপনার নাম</label>
                    <input type="text" id="signup-name" placeholder="আপনার পুরো নাম" required>
                </div>
                <div class="input-group">
                    <label>ইমেইল আইডি</label>
                    <input type="email" id="signup-email" placeholder="example@gmail.com" required>
                </div>
                <div class="input-group">
                    <label>পাসওয়ার্ড</label>
                    <input type="password" id="signup-password" placeholder="কমপক্ষে ৬ অক্ষরের পাসওয়ার্ড" required minlength="6">
                </div>
                
                <button type="submit" class="auth-btn" id="signup-btn" style="margin-top: 10px;">অ্যাকাউন্ট খুলুন</button>
            </form>
        </div>
        
        <!-- Message Alert Box -->
        <div id="message"></div>
    </div>

    <!-- Firebase & JavaScript -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBZNrrK7MLGIZoPakMgj2yFEX7iCVYYhlg",
            authDomain: "amrdraz-d0682.firebaseapp.com",
            projectId: "amrdraz-d0682",
            storageBucket: "amrdraz-d0682.firebasestorage.app",
            messagingSenderId: "690289096145",
            appId: "1:690289096145:web:dbebaa4e60203a7922dcf0"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const messageBox = document.getElementById("message");

        // Tab Switching Logic
        window.switchTab = function(tab) {
            document.getElementById('login-section').classList.remove('active');
            document.getElementById('signup-section').classList.remove('active');
            document.getElementById('tab-login').classList.remove('active');
            document.getElementById('tab-signup').classList.remove('active');
            
            if(tab === 'login') {
                document.getElementById('login-section').classList.add('active');
                document.getElementById('tab-login').classList.add('active');
            } else {
                document.getElementById('signup-section').classList.add('active');
                document.getElementById('tab-signup').classList.add('active');
            }
            messageBox.style.display = "none"; // Hide message on tab switch
        }

        function showMessage(text, isError) {
            messageBox.innerText = text;
            messageBox.style.color = isError ? "#e74c3c" : "#28a745";
            messageBox.style.backgroundColor = isError ? "#fdecep" : "#e8f5e9";
            messageBox.style.border = `1px solid ${isError ? "#e74c3c" : "#28a745"}`;
            messageBox.style.display = "block";
        }

        // 🌟 Login Handler
        document.getElementById("login-form").addEventListener("submit", (e) => {
            e.preventDefault();
            const email = document.getElementById("login-email").value;
            const password = document.getElementById("login-password").value;
            const btn = document.getElementById("login-btn");

            btn.innerText = "লগইন হচ্ছে...";
            btn.disabled = true;

            signInWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    // লগইন সফল হলে হোমপেজে বা অ্যাডমিন প্যানেলে পাঠাবে
                    if(email === "sakibbinsalam.cs@gmail.com") {
                        window.location.href = "admin.html"; // অ্যাডমিনের জন্য
                    } else {
                        window.location.href = "index.html"; // সাধারণ ইউজারের জন্য
                    }
                })
                .catch((error) => {
                    btn.innerText = "লগইন করুন";
                    btn.disabled = false;
                    let errorMsg = "লগইন ব্যর্থ হয়েছে!";
                    if(error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential') {
                        errorMsg = "ইমেইল অথবা পাসওয়ার্ড ভুল হয়েছে!";
                    }
                    showMessage(errorMsg, true);
                });
        });

        // 🌟 Signup Handler
        document.getElementById("signup-form").addEventListener("submit", (e) => {
            e.preventDefault();
            const email = document.getElementById("signup-email").value;
            const password = document.getElementById("signup-password").value;
            const btn = document.getElementById("signup-btn");

            btn.innerText = "অ্যাকাউন্ট তৈরি হচ্ছে...";
            btn.disabled = true;

            createUserWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    showMessage("✔ অ্যাকাউন্ট সফলভাবে তৈরি হয়েছে!", false);
                    setTimeout(() => {
                        window.location.href = "index.html";
                    }, 1000);
                })
                .catch((error) => {
                    btn.innerText = "অ্যাকাউন্ট খুলুন";
                    btn.disabled = false;
                    let errorMsg = "অ্যাকাউন্ট তৈরি করা যায়নি!";
                    if(error.code === 'auth/email-already-in-use') {
                        errorMsg = "এই ইমেইলটি আগে থেকেই ব্যবহৃত হচ্ছে!";
                    } else if(error.code === 'auth/weak-password') {
                        errorMsg = "পাসওয়ার্ডটি খুব দুর্বল, অন্য পাসওয়ার্ড দিন।";
                    }
                    showMessage(errorMsg, true);
                });
        });
    </script>
</body>
</html>
