<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>লগইন ও সাইন-আপ</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f0f2f5; }
        .container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 350px; text-align: center; }
        
        .tabs { display: flex; justify-content: space-between; margin-bottom: 20px; }
        .tab { flex: 1; padding: 10px; cursor: pointer; font-weight: bold; color: #555; border-bottom: 2px solid transparent; }
        .tab.active { color: #007bff; border-bottom: 2px solid #007bff; }
        
        form { display: flex; flex-direction: column; }
        input { padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; outline: none; }
        input:focus { border-color: #007bff; }
        button { padding: 12px; background-color: #007bff; color: white; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background-color: #0056b3; }
        
        .signup-form { display: none; } /* শুরুতে সাইন-আপ ফর্ম লুকানো থাকবে */
    </style>
</head>
<body>

    <div class="container">
        <div class="tabs">
            <div class="tab active" id="loginTab" onclick="showLogin()">লগইন</div>
            <div class="tab" id="signupTab" onclick="showSignup()">সাইন-আপ</div>
        </div>

        <!-- Login Form -->
        <form id="loginForm">
            <input type="email" id="loginEmail" placeholder="আপনার ইমেইল" required>
            <input type="password" id="loginPassword" placeholder="পাসওয়ার্ড" required>
            <button type="submit">লগইন করুন</button>
        </form>

        <!-- Signup Form -->
        <form id="signupForm" class="signup-form">
            <input type="text" id="signupName" placeholder="আপনার সম্পূর্ণ নাম" required>
            <input type="email" id="signupEmail" placeholder="আপনার ইমেইল" required>
            <input type="password" id="signupPassword" placeholder="নতুন পাসওয়ার্ড দিন" required>
            <button type="submit">অ্যাকাউন্ট খুলুন</button>
        </form>
    </div>

    <script>
        // লগইন ও সাইন-আপ ফর্ম পরিবর্তনের জন্য ছোট্ট জাভাস্ক্রিপ্ট
        function showLogin() {
            document.getElementById('loginForm').style.display = 'flex';
            document.getElementById('signupForm').style.display = 'none';
            document.getElementById('loginTab').classList.add('active');
            document.getElementById('signupTab').classList.remove('active');
        }

        function showSignup() {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('signupForm').style.display = 'flex';
            document.getElementById('signupTab').classList.add('active');
            document.getElementById('loginTab').classList.remove('active');
        }
    </script>
</body>
</html>
