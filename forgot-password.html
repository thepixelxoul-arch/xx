<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>পাসওয়ার্ড ভুলে গেছেন? - আমার দারাজ</title>
    
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background-color: #f4f4f6; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        
        .auth-container { 
            background: white; 
            padding: 40px; 
            border-radius: 8px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            width: 90%; 
            max-width: 400px; 
            text-align: center; 
        }
        
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #f85606;
            margin-bottom: 20px;
            text-decoration: none;
            display: inline-block;
        }

        .auth-container h2 { color: #333; margin-bottom: 10px; font-size: 22px; }
        .auth-container p { color: #666; font-size: 14px; margin-bottom: 25px; line-height: 1.5; }
        
        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; margin-bottom: 8px; color: #333; font-weight: bold; font-size: 14px; }
        .input-group input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 15px; outline: none; transition: 0.3s; }
        .input-group input:focus { border-color: #f85606; box-shadow: 0 0 5px rgba(248, 86, 6, 0.3); }
        
        .auth-btn { background-color: #f85606; color: white; border: none; padding: 14px; width: 100%; border-radius: 4px; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.3s; }
        .auth-btn:hover { background-color: #d84a05; }
        
        .auth-links { margin-top: 20px; font-size: 14px; }
        .auth-links a { color: #f85606; text-decoration: none; font-weight: bold; transition: 0.3s; }
        .auth-links a:hover { text-decoration: underline; color: #d84a05; }
        
        #message { margin-top: 15px; font-size: 14px; font-weight: bold; display: none; padding: 10px; border-radius: 4px; }
    </style>
</head>
<body>

    <div class="auth-container">
        <a href="index.html" class="logo">AmarDaraz</a>
        <h2>পাসওয়ার্ড রিকভারি</h2>
        <p>আপনার অ্যাকাউন্টের ইমেইল আইডিটি দিন। আমরা আপনার ইমেইলে নতুন পাসওয়ার্ড সেট করার একটি লিংক পাঠিয়ে দেব।</p>
        
        <div class="input-group">
            <label>ইমেইল আইডি</label>
            <input type="email" id="reset-email" placeholder="আপনার ইমেইল দিন (যেমন: example@gmail.com)" required>
        </div>
        
        <button class="auth-btn" id="reset-btn">রিসেট লিংক পাঠান</button>
        
        <div id="message"></div>
        
        <div class="auth-links">
            <p>পাসওয়ার্ড মনে পড়েছে? <a href="login.html">লগইন করুন</a></p>
        </div>
    </div>

    <!-- Firebase Authentication Javascript -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { getAuth, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

        // আপনার ফায়ারবেস কনফিগারেশন
        const firebaseConfig = {
            apiKey: "AIzaSyBZNrrK7MLGIZoPakMgj2yFEX7iCVYYhlg",
            authDomain: "amrdraz-d0682.firebaseapp.com",
            projectId: "amrdraz-d0682",
            storageBucket: "amrdraz-d0682.firebasestorage.app",
            messagingSenderId: "690289096145",
            appId: "1:690289096145:web:dbebaa4e60203a7922dcf0"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const resetBtn = document.getElementById("reset-btn");
        const resetEmail = document.getElementById("reset-email");
        const messageBox = document.getElementById("message");

        // বাটনে ক্লিক করলে যা হবে
        resetBtn.addEventListener("click", () => {
            const email = resetEmail.value.trim();
            
            if(!email) {
                showMessage("দয়া করে আপনার ইমেইল আইডি দিন!", "#e74c3c", "#fdecep");
                return;
            }

            // বাটন লোডিং স্ট্যাটাস
            resetBtn.innerText = "লিংক পাঠানো হচ্ছে...";
            resetBtn.style.opacity = "0.7";
            resetBtn.disabled = true;

            // ফায়ারবেসকে পাসওয়ার্ড রিসেট লিংক পাঠাতে বলা
            sendPasswordResetEmail(auth, email)
                .then(() => {
                    showMessage("✔ আপনার ইমেইলে পাসওয়ার্ড রিসেট লিংক পাঠানো হয়েছে! দয়া করে আপনার ইনবক্স (বা Spam ফোল্ডার) চেক করুন।", "#28a745", "#e8f5e9");
                    resetBtn.innerText = "রিসেট লিংক পাঠান";
                    resetBtn.style.opacity = "1";
                    resetBtn.disabled = false;
                    resetEmail.value = ""; // ইনপুট বক্স খালি করে দেওয়া
                })
                .catch((error) => {
                    let errorMsg = "কোথাও কোনো সমস্যা হয়েছে! আবার চেষ্টা করুন।";
                    if(error.code === "auth/user-not-found" || error.code === "auth/invalid-email") {
                        errorMsg = "এই ইমেইল দিয়ে কোনো অ্যাকাউন্ট পাওয়া যায়নি!";
                    }
                    showMessage("❌ " + errorMsg, "#e74c3c", "#fdecep");
                    
                    resetBtn.innerText = "রিসেট লিংক পাঠান";
                    resetBtn.style.opacity = "1";
                    resetBtn.disabled = false;
                });
        });

        // মেসেজ দেখানোর ফাংশন
        function showMessage(text, color, bgColor) {
            messageBox.innerText = text;
            messageBox.style.color = color;
            messageBox.style.backgroundColor = bgColor;
            messageBox.style.border = `1px solid ${color}`;
            messageBox.style.display = "block";
        }
    </script>

</body>
</html>
