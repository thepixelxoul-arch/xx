<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>অর্ডার হিস্ট্রি - আমার দারাজ</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f6; margin: 0; }
        .navbar { background-color: #f85606; padding: 15px 20px; color: white; display: flex; justify-content: space-between; align-items: center; }
        .navbar .logo { font-size: 24px; font-weight: bold; text-decoration: none; color: white; }
        .navbar .home-link { color: white; text-decoration: none; font-size: 20px; }
        
        .history-container { display: flex; justify-content: center; align-items: flex-start; min-height: 80vh; padding: 20px; margin-top: 20px;}
        .history-card { background: white; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 600px; padding: 30px; box-sizing: border-box; }
        
        .list-item { border: 1px solid #eee; padding: 15px; border-radius: 8px; margin-bottom: 15px; background: #fafafa; }
        .list-item h4 { margin: 0 0 10px 0; color: #333; display: flex; justify-content: space-between; align-items: flex-start;}
        .list-item p { margin: 5px 0; color: #666; font-size: 14px; line-height: 1.4; }
        
        .status-badge { padding: 4px 8px; border-radius: 12px; font-size: 12px; font-weight: bold; white-space: nowrap;}
        .status-pending { background-color: #fff3cd; color: #856404; }
        .status-completed { background-color: #d4edda; color: #155724; }
        
        .loading-text { text-align: center; color: #777; font-weight: bold; padding: 20px 0; }
        .empty-text { text-align: center; color: #777; padding: 20px 0; font-size: 16px;}
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="logo">AmarDaraz</a>
        <a href="index.html" class="home-link">🏠 হোম</a>
    </nav>

    <div class="history-container">
        <div class="history-card">
            <h2 style="text-align: center; color: #333; margin-top: 0; margin-bottom: 25px;">🛒 আপনার অর্ডার হিস্ট্রি</h2>
            <div id="orders-container">
                <div class="loading-text">অর্ডার লোড হচ্ছে...</div>
            </div>
        </div>
    </div>

    <!-- Firebase Setup -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
        import { getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBZNrrK7MLGIZoPakMgj2yFEX7iCVYYhlg",
            authDomain: "amrdraz-d0682.firebaseapp.com",
            projectId: "amrdraz-d0682",
            storageBucket: "amrdraz-d0682.firebasestorage.app",
            messagingSenderId: "690289096145",
            appId: "1:690289096145:web:dbebaa4e60203a7922dcf0"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                loadUserOrders(user.email);
            } else {
                window.location.href = "login.html";
            }
        });

        async function loadUserOrders(email) {
            const container = document.getElementById("orders-container");
            try {
                const q = query(collection(db, "orders"), where("userEmail", "==", email));
                const querySnapshot = await getDocs(q);
                
                if (querySnapshot.empty) {
                    container.innerHTML = "<div class='empty-text'>আপনি এখনও কোনো অর্ডার করেননি।</div>";
                    return;
                }

                let html = "";
                // ডাটাবেস থেকে সব অর্ডার নিয়ে একটি লিস্ট তৈরি করা হচ্ছে
                let orders = [];
                querySnapshot.forEach((docSnap) => {
                    orders.push({ id: docSnap.id, ...docSnap.data() });
                });
                
                // নতুন অর্ডারগুলো যেন আগে দেখায়
                orders.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp)); 

                orders.forEach((data) => {
                    const isCompleted = data.status === 'Completed';
                    html += `
                        <div class="list-item">
                            <h4>
                                <span style="font-size: 15px; color: #f85606;">📦 ${data.productName}</span>
                                <span class="status-badge ${isCompleted ? 'status-completed' : 'status-pending'}">${isCompleted ? 'কমপ্লিট' : 'পেন্ডিং'}</span>
                            </h4>
                            <p><strong>দাম:</strong> ৳ ${data.price}</p>
                            <p><small style="color: #999;">অর্ডার আইডি: ${data.id}</small></p>
                        </div>
                    `;
                });
                container.innerHTML = html;
            } catch(e) { 
                container.innerHTML = "<div class='empty-text' style='color:red;'>অর্ডার লোড করতে সমস্যা হয়েছে।</div>"; 
            }
        }
    </script>
</body>
</html>
