<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>অ্যাড ফান্ড - আমার দারাজ</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f6; margin: 0; padding: 20px; }
        .fund-container { max-width: 500px; margin: 40px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        
        h2 { color: #f85606; margin-top: 0; text-align: center; border-bottom: 2px solid #eee; padding-bottom: 15px; }
        .balance-display { text-align: center; font-size: 18px; color: #333; margin-bottom: 20px; font-weight: bold; background: #f9f9f9; padding: 10px; border-radius: 5px;}
        .balance-display span { color: #2ecc71; font-size: 22px; }

        label { font-weight: bold; font-size: 14px; color: #333; display: block; margin-top: 15px; margin-bottom: 5px; }
        input[type="number"], input[type="text"] { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 15px; }
        
        /* Payment Methods - লোগো স্মুথ ও ক্লিয়ার করা হয়েছে */
        .payment-methods { display: flex; gap: 12px; margin-top: 15px; flex-wrap: wrap; justify-content: center;}
        .pay-btn { 
            flex: 1; 
            min-width: 80px;
            max-width: 110px; 
            height: 60px; 
            border: 2px solid #eaeaea; 
            background: white; 
            cursor: pointer; 
            border-radius: 8px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            transition: 0.3s; 
            padding: 8px 12px; /* লোগো যেন বক্সের সাথে লেগে না যায় */
        }
        .pay-btn img { 
            width: 100%; 
            height: 100%; 
            object-fit: contain; /* ছবিকে না ফাটিয়ে বক্সে মানানসই করবে */
        }
        
        .pay-btn:hover { border-color: #ccc; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .bKash.active { border-color: #e2136e; background: #fff9fb; box-shadow: 0 0 8px rgba(226, 19, 110, 0.2); }
        .Nagad.active { border-color: #f7931e; background: #fffcf8; box-shadow: 0 0 8px rgba(247, 147, 30, 0.2); }
        .Rocket.active { border-color: #8c1596; background: #fdf2ff; box-shadow: 0 0 8px rgba(140, 21, 150, 0.2); }
        .Upay.active { border-color: #0063a6; background: #f4fafe; box-shadow: 0 0 8px rgba(0, 99, 166, 0.2); }

        /* Instruction Box */
        .instruction-box { background: #e8f4fd; padding: 15px; border-radius: 5px; margin-top: 15px; font-size: 14px; color: #333; display: none; border-left: 4px solid #007bff; line-height: 1.5; text-align: center;}
        .account-number { font-size: 20px; font-weight: bold; color: #e74c3c; user-select: all; letter-spacing: 1px; display: block; margin-top: 5px;}

        .submit-btn { width: 100%; padding: 14px; background: #28a745; color: white; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 25px; transition: 0.3s; }
        .submit-btn:hover { background: #218838; }
        
        .back-link { display: block; text-align: center; margin-top: 20px; color: #777; text-decoration: none; font-size: 14px; font-weight: bold;}
        .back-link:hover { color: #f85606; }
    </style>
</head>
<body>

    <div class="fund-container">
        <h2>💰 ব্যালেন্স অ্যাড করুন</h2>
        
        <div class="balance-display">
            বর্তমান ব্যালেন্স: <span id="current-balance">৳ 0</span>
        </div>

        <label>কত টাকা অ্যাড করতে চান? (৳)</label>
        <input type="number" id="deposit-amount" placeholder="যেমন: 500" required>

        <label>পেমেন্ট মেথড সিলেক্ট করুন:</label>
        <div class="payment-methods">
            <div class="pay-btn bKash" onclick="selectPayment('bKash')">
                <img src="bkash.png" alt="bKash">
            </div>
            <div class="pay-btn Nagad" onclick="selectPayment('Nagad')">
                <img src="nagad.png" alt="Nagad">
            </div>
            <div class="pay-btn Rocket" onclick="selectPayment('Rocket')">
                <img src="roket.png" alt="Rocket">
            </div>
            <div class="pay-btn Upay" onclick="selectPayment('Upay')">
                <img src="upay.png" alt="Upay">
            </div>
        </div>

        <!-- Instruction Box -->
        <div id="instruction-box" class="instruction-box">
            <span id="instruction-text"></span>
            <span class="account-number" id="account-number"></span>
            <small style="color: #666; display: block; margin-top: 5px;">(অবশ্যই Send Money করবেন)</small>
        </div>

        <form id="deposit-form" style="display: none;">
            <label>যে নাম্বার থেকে টাকা পাঠিয়েছেন:</label>
            <input type="number" id="sender-number" placeholder="যেমন: 01XXXXXXXXX" required>

            <label>Transaction ID (TrxID):</label>
            <input type="text" id="trx-id" placeholder="টাকা পাঠানোর মেসেজে থাকা TrxID" required>

            <button type="submit" class="submit-btn" id="submit-deposit-btn">ডিপোজিট রিকোয়েস্ট পাঠান</button>
        </form>

        <a href="profile.html" class="back-link">⬅ প্রোফাইলে ফিরে যান</a>
    </div>

    <!-- Firebase Setup -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, addDoc } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBZNrrK7MLGIZoPakMgj2yFEX7iCVYYhlg",
            authDomain: "amrdraz-d0682.firebaseapp.com",
            projectId: "amrdraz-d0682",
            storageBucket: "amrdraz-d0682.firebasestorage.app",
            messagingSenderId: "690289096145",
            appId: "1:690289096145:web:dbebaa4e60203a7922dcf0"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUserEmail = null;
        let selectedGateway = "";

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUserEmail = user.email;
                try {
                    const userDoc = await getDoc(doc(db, "users", user.email));
                    if(userDoc.exists()) {
                        document.getElementById("current-balance").innerText = `৳ ${userDoc.data().balance || 0}`;
                    }
                } catch(e) { console.log("Error loading balance"); }
            } else {
                alert("ডিপোজিট করতে হলে আপনাকে প্রথমে লগইন করতে হবে!");
                window.location.href = "login.html";
            }
        });

        window.selectPayment = function(method) {
            const amount = document.getElementById("deposit-amount").value;
            if(!amount || amount <= 0) {
                alert("প্রথমে টাকার পরিমাণ লিখুন!");
                return;
            }

            document.querySelectorAll('.pay-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector(`.${method}`).classList.add('active');
            selectedGateway = method;

            const instBox = document.getElementById("instruction-box");
            const form = document.getElementById("deposit-form");
            const instText = document.getElementById("instruction-text");
            const accNum = document.getElementById("account-number");

            instBox.style.display = "block";
            form.style.display = "block";

            if(method === 'bKash') {
                instText.innerHTML = `নিচের পার্সোনাল বিকাশ নাম্বারে <b>৳ ${amount}</b> Send Money করুন:`;
                accNum.innerText = "01XXXXXXXXX"; 
                instBox.style.borderLeftColor = "#e2136e";
            } else if(method === 'Nagad') {
                instText.innerHTML = `নিচের পার্সোনাল নগদ নাম্বারে <b>৳ ${amount}</b> Send Money করুন:`;
                accNum.innerText = "01XXXXXXXXX"; 
                instBox.style.borderLeftColor = "#f7931e";
            } else if(method === 'Rocket') {
                instText.innerHTML = `নিচের পার্সোনাল রকেট নাম্বারে <b>৳ ${amount}</b> Send Money করুন:`;
                accNum.innerText = "01XXXXXXXXX"; 
                instBox.style.borderLeftColor = "#8c1596";
            } else if(method === 'Upay') {
                instText.innerHTML = `নিচের পার্সোনাল উপায় নাম্বারে <b>৳ ${amount}</b> Send Money করুন:`;
                accNum.innerText = "01XXXXXXXXX"; 
                instBox.style.borderLeftColor = "#0063a6";
            }
        };

        document.getElementById("deposit-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            if(!currentUserEmail) return alert("দয়া করে লগইন করুন!");

            const submitBtn = document.getElementById("submit-deposit-btn");
            submitBtn.innerText = "রিকোয়েস্ট পাঠানো হচ্ছে...";
            submitBtn.disabled = true;

            const depositData = {
                userEmail: currentUserEmail,
                amount: parseInt(document.getElementById("deposit-amount").value),
                paymentMethod: selectedGateway,
                senderNumber: document.getElementById("sender-number").value,
                trxId: document.getElementById("trx-id").value,
                status: "Pending", 
                timestamp: new Date().toISOString()
            };

            try {
                await addDoc(collection(db, "deposits"), depositData);
                alert("আপনার ডিপোজিট রিকোয়েস্ট সফলভাবে পাঠানো হয়েছে!");
                window.location.href = "profile.html"; 
            } catch (error) {
                console.error("Error submitting deposit: ", error);
                alert("রিকোয়েস্ট পাঠাতে সমস্যা হচ্ছে!");
                submitBtn.innerText = "ডিপোজিট রিকোয়েস্ট পাঠান";
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
