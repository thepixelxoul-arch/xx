<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>লাকি স্পিন হুইল - আমার দারাজ</title>
    
    <style>
        body { margin: 0; padding: 0; background-color: #f4f4f6; font-family: Arial, sans-serif; overflow-x: hidden; }
        
        /* Navbar */
        .navbar { background-color: #f85606; padding: 15px 20px; display: flex; align-items: center; justify-content: space-between; color: white; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .logo { font-size: 24px; font-weight: bold; color: white; text-decoration: none; }
        .nav-links { display: flex; align-items: center; gap: 20px; }
        .nav-links a { text-decoration: none; font-weight: bold; font-size: 15px; color: white; display: flex; align-items: center; gap: 5px; }
        
        /* Game Container */
        .game-wrapper { display: flex; justify-content: center; padding: 40px 20px; min-height: calc(100vh - 150px); align-items: center; }
        .game-board { background-color: #1e2024; border-radius: 16px; width: 100%; max-width: 900px; display: flex; box-shadow: 0 15px 40px rgba(0,0,0,0.4); overflow: hidden; flex-wrap: wrap; border: 1px solid #333;}
        
        /* Left Panel - Wheel */
        .wheel-panel { flex: 1.5; padding: 40px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; min-width: 320px; border-right: 1px solid #333;}
        
        .wheel-container { position: relative; width: 320px; height: 320px; margin-bottom: 20px; }
        
        /* Pointer */
        .pointer { position: absolute; top: -20px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 20px solid transparent; border-right: 20px solid transparent; border-top: 35px solid #fff; z-index: 20; filter: drop-shadow(0 5px 5px rgba(0,0,0,0.5));}
        .pointer::after { content: ''; position: absolute; top: -35px; left: -15px; width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent; border-top: 30px solid #f85606; }

        /* The Spinning Wheel */
        .wheel {
            width: 100%; height: 100%; border-radius: 50%; position: relative; overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.5), inset 0 0 15px rgba(0,0,0,0.5);
            /* 8 Slices - 45 deg each */
            background: conic-gradient(
                #e74c3c 0deg 45deg,    /* 0x */
                #2ecc71 45deg 90deg,   /* 1.5x */
                #e74c3c 90deg 135deg,  /* 0x */
                #3498db 135deg 180deg, /* 2.0x */
                #f1c40f 180deg 225deg, /* 0.5x */
                #9b59b6 225deg 270deg, /* 5.0x */
                #e74c3c 270deg 315deg, /* 0x */
                #1abc9c 315deg 360deg  /* 1.2x */
            );
            transition: transform 4s cubic-bezier(0.15, 0.85, 0.15, 1);
            transform: rotate(0deg);
        }

        /* Center Hub */
        .wheel-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 60px; height: 60px; background: #16181b; border-radius: 50%; border: 4px solid #fff; box-shadow: 0 0 15px rgba(0,0,0,0.5); z-index: 10; display: flex; justify-content: center; align-items: center; color: #f85606; font-weight: bold; font-size: 20px;}
        
        /* Wheel Labels */
        .label { position: absolute; width: 100%; height: 100%; text-align: center; color: white; font-weight: bold; font-size: 20px; padding-top: 25px; box-sizing: border-box; text-shadow: 1px 1px 3px rgba(0,0,0,0.8); }
        .lbl-1 { transform: rotate(22.5deg); }
        .lbl-2 { transform: rotate(67.5deg); }
        .lbl-3 { transform: rotate(112.5deg); }
        .lbl-4 { transform: rotate(157.5deg); }
        .lbl-5 { transform: rotate(202.5deg); }
        .lbl-6 { transform: rotate(247.5deg); }
        .lbl-7 { transform: rotate(292.5deg); }
        .lbl-8 { transform: rotate(337.5deg); }

        /* Right Panel - Controls */
        .controls-panel { padding: 40px 30px; flex: 1; min-width: 300px; background-color: #26292e; color: #fff; display: flex; flex-direction: column; justify-content: center;}
        .controls-panel h3 { color: #f85606; margin-top: 0; margin-bottom: 30px; font-size: 26px; text-transform: uppercase; letter-spacing: 1px; text-align: center;}
        
        .input-group { margin-bottom: 25px; }
        .input-group label { display: block; margin-bottom: 8px; font-size: 13px; color: #aaa; text-transform: uppercase; font-weight: bold;}
        .input-box { display: flex; background: #16181b; border-radius: 8px; overflow: hidden; border: 2px solid #3d4046; transition: 0.3s; }
        .input-box:focus-within { border-color: #f85606; }
        .currency-tag { background: #3d4046; padding: 15px; color: #fff; font-weight: bold; font-size: 18px;}
        .input-box input { flex: 1; background: transparent; border: none; color: #fff; padding: 15px; font-size: 20px; outline: none; font-weight: bold; text-align: center;}
        
        /* Spin Button */
        .spin-btn { width: 100%; background: linear-gradient(135deg, #f85606, #d84a05); border: none; color: white; padding: 20px; border-radius: 8px; font-size: 22px; font-weight: bold; cursor: pointer; transition: 0.3s; box-shadow: 0 5px 15px rgba(248,86,6,0.4); text-transform: uppercase; letter-spacing: 2px; margin-top: 10px;}
        .spin-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(248,86,6,0.6); }
        .spin-btn:disabled { background: #555; box-shadow: none; cursor: not-allowed; transform: none; color: #999;}

        /* Recent Result Display */
        .result-box { margin-top: 30px; background: #16181b; padding: 20px; border-radius: 8px; text-align: center; border: 1px dashed #3d4046;}
        .result-title { font-size: 14px; color: #aaa; text-transform: uppercase; margin-bottom: 10px;}
        .result-amount { font-size: 28px; font-weight: bold; color: #fff; }
        
        /* Toast Notification */
        .toast-notification { visibility: hidden; min-width: 280px; background-color: #333; color: #fff; text-align: center; border-radius: 6px; padding: 16px; position: fixed; z-index: 4000; left: 50%; top: 30px; transform: translateX(-50%); font-size: 16px; font-weight: bold; box-shadow: 0 5px 15px rgba(0,0,0,0.2); opacity: 0; transition: opacity 0.3s, top 0.3s; }
        .toast-notification.show { visibility: visible; opacity: 1; top: 50px; }
        .toast-success { background-color: #28a745; }
        .toast-error { background-color: #e74c3c; }
        .toast-warning { background-color: #f39c12; color: #fff; }

        @media (max-width: 768px) {
            .game-board { flex-direction: column; }
            .wheel-panel { border-right: none; border-bottom: 1px solid #333; padding: 30px 20px;}
            .wheel-container { width: 260px; height: 260px; }
            .controls-panel { padding: 30px 20px; }
        }
    </style>
</head>
<body>

    <div id="toast" class="toast-notification">Notification text</div>

    <!-- Navbar -->
    <nav class="navbar">
        <a href="index.html" class="logo">AmarDaraz</a>
        <div class="nav-links">
            <a href="#" id="balance-display">💰 ব্যালেন্স: ৳ 0</a>
            <a href="index.html" style="background: white; color: #f85606; padding: 8px 15px; border-radius: 20px;">হোমে ফিরুন</a>
        </div>
    </nav>

    <!-- Game Area -->
    <div class="game-wrapper">
        <div class="game-board">
            
            <!-- Left Panel (Visual Wheel) -->
            <div class="wheel-panel">
                <div class="pointer"></div>
                <div class="wheel-container">
                    <div class="wheel" id="wheel">
                        <!-- Labels inside the wheel -->
                        <div class="label lbl-1">0x</div>
                        <div class="label lbl-2">1.5x</div>
                        <div class="label lbl-3">0x</div>
                        <div class="label lbl-4">2x</div>
                        <div class="label lbl-5">0.5x</div>
                        <div class="label lbl-6">5x</div>
                        <div class="label lbl-7">0x</div>
                        <div class="label lbl-8">1.2x</div>
                        
                        <div class="wheel-center">৳</div>
                    </div>
                </div>
            </div>

            <!-- Right Panel (Controls) -->
            <div class="controls-panel">
                <h3>🎰 Lucky Spin 🎰</h3>
                
                <div class="input-group">
                    <label>বেটের পরিমাণ (Bet Amount)</label>
                    <div class="input-box">
                        <div class="currency-tag">৳</div>
                        <input type="number" id="bet-amount" value="20" min="1" step="1">
                    </div>
                </div>

                <button class="spin-btn" id="spin-btn">SPIN NOW!</button>

                <div class="result-box">
                    <div class="result-title">সর্বশেষ ফলাফল</div>
                    <div class="result-amount" id="result-text">--</div>
                </div>
            </div>

        </div>
    </div>

    <!-- Firebase & JavaScript -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBZNrrK7MLGIZoPakMgj2yFEX7iCVYYhlg",
            authDomain: "amrdraz-d0682.firebaseapp.com",
            projectId: "amrdraz-d0682",
            storageBucket: "amrdraz-d0682.firebasestorage.app",
            messagingSenderId: "690289096145",
            appId: "1:690289096145:web:dbebaa4e60203a7922dcf0"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Elements
        const balanceDisplay = document.getElementById("balance-display");
        const betInput = document.getElementById("bet-amount");
        const wheel = document.getElementById("wheel");
        const spinBtn = document.getElementById("spin-btn");
        const resultText = document.getElementById("result-text");

        let currentUserEmail = null;
        let currentBalance = 0;
        let isSpinning = false;
        let currentRotation = 0; // Keep track of total rotation

        // 🌟 Wheel Slices Data (8 Slices, 45 degrees each)
        // Array index 0 matches lbl-1, 1 matches lbl-2 etc.
        const slices = [
            { mult: 0,   name: "0x (Loss)" },
            { mult: 1.5, name: "1.5x (Win)" },
            { mult: 0,   name: "0x (Loss)" },
            { mult: 2.0, name: "2x (Win)" },
            { mult: 0.5, name: "0.5x (Partial)" },
            { mult: 5.0, name: "5x (JACKPOT!)" },
            { mult: 0,   name: "0x (Loss)" },
            { mult: 1.2, name: "1.2x (Win)" }
        ];

        function showToast(message, type = "success") {
            const toast = document.getElementById("toast");
            toast.innerText = message;
            toast.className = "toast-notification show";
            if(type === "error") toast.classList.add("toast-error");
            else if (type === "warning") toast.classList.add("toast-warning");
            else toast.classList.add("toast-success");

            setTimeout(() => { toast.className = "toast-notification"; }, 3500);
        }

        // Authentication
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUserEmail = user.email;
                fetchBalance();
            } else {
                showToast("আপনাকে প্রথমে লগইন করতে হবে!", "warning");
                setTimeout(() => { window.location.href = "login.html"; }, 1500);
            }
        });

        async function fetchBalance() {
            try {
                const userDoc = await getDoc(doc(db, "users", currentUserEmail));
                if (userDoc.exists()) {
                    currentBalance = userDoc.data().balance || 0;
                    balanceDisplay.innerText = `💰 ব্যালেন্স: ৳ ${currentBalance.toFixed(2)}`;
                }
            } catch (e) {
                console.error(e);
            }
        }

        // Spin Game Logic
        spinBtn.addEventListener('click', async () => {
            if (isSpinning) return;
            
            let betAmount = parseFloat(betInput.value) || 0;

            if (betAmount <= 0) {
                showToast("দয়া করে সঠিক বেট অ্যামাউন্ট দিন!", "warning");
                return;
            }
            if (betAmount > currentBalance) {
                showToast("❌ আপনার অ্যাকাউন্টে পর্যাপ্ত ব্যালেন্স নেই!", "error");
                return;
            }

            isSpinning = true;
            spinBtn.disabled = true;
            spinBtn.innerText = "SPINNING...";
            resultText.innerText = "ঘুরছে...";
            resultText.style.color = "#aaa";
            
            try {
                // ১. বেটের টাকা ব্যালেন্স থেকে কাটা হলো
                currentBalance -= betAmount;
                balanceDisplay.innerText = `💰 ব্যালেন্স: ৳ ${currentBalance.toFixed(2)}`;
                const userRef = doc(db, "users", currentUserEmail);
                await updateDoc(userRef, { balance: currentBalance });

                // ২. র‍্যান্ডম স্লাইস সিলেক্ট করা (0 থেকে 7)
                // একটু চালাকি করে জেতার চান্স ব্যালেন্স করা যেতে পারে, তবে আপাতত ফুল র‍্যান্ডম
                const randomSliceIndex = Math.floor(Math.random() * 8); 
                const targetSlice = slices[randomSliceIndex];
                
                // ৩. কত ডিগ্রি ঘুরাতে হবে হিসাব করা
                // প্রতিটি স্লাইস 45 ডিগ্রির। 
                const sliceCenterAngle = (randomSliceIndex * 45) + 22.5; 
                
                // চাকা যেন টপে (0 ডিগ্রিতে) এসে থামে তার হিসাব
                const spins = 360 * 5; // ৫ বার ফুল ঘুরবে
                const targetAngle = 360 - sliceCenterAngle;
                
                // বর্তমান রোটেশন থেকে কতটুকু ঘুরাতে হবে তা যোগ করা
                const currentMod = currentRotation % 360;
                const rotationNeeded = (360 - currentMod) + spins + targetAngle;
                currentRotation += rotationNeeded;

                // ৪. চাকা ঘোরানো শুরু (CSS Animation)
                wheel.style.transform = `rotate(${currentRotation}deg)`;

                // ৫. চাকা থামা পর্যন্ত অপেক্ষা (4 সেকেন্ড)
                setTimeout(async () => {
                    const payout = betAmount * targetSlice.mult;

                    // রেজাল্ট দেখানো
                    if (targetSlice.mult > 0) {
                        resultText.innerText = `+ ৳ ${payout.toFixed(2)}`;
                        resultText.style.color = "#2ecc71"; // Green
                        
                        if(targetSlice.mult >= 2) {
                            showToast(`🎉 জ্যাকপট! আপনি ${targetSlice.name} পেয়েছেন!`, "success");
                        } else {
                            showToast(`✅ আপনি জিতেছেন ৳ ${payout.toFixed(2)}!`, "success");
                        }

                        // ব্যালেন্সে লাভ যোগ করা
                        currentBalance += payout;
                        balanceDisplay.innerText = `💰 ব্যালেন্স: ৳ ${currentBalance.toFixed(2)}`;
                        await updateDoc(userRef, { balance: currentBalance });
                    } else {
                        resultText.innerText = `হেরেছেন ৳ ${betAmount.toFixed(2)}`;
                        resultText.style.color = "#e74c3c"; // Red
                        showToast(`😢 আপনি হেরে গেছেন! আবার চেষ্টা করুন।`, "error");
                    }

                    // বাটন রিসেট
                    isSpinning = false;
                    spinBtn.disabled = false;
                    spinBtn.innerText = "SPIN AGAIN!";
                }, 4000); // 4 seconds animation timer
                
            } catch(e) {
                console.error(e);
                showToast("সার্ভার এরর! গেম খেলা যাচ্ছে না।", "error");
                isSpinning = false;
                spinBtn.disabled = false;
                spinBtn.innerText = "SPIN NOW!";
            }
        });
    </script>
</body>
</html>
