<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>লাকি স্পিন হুইল - আমার দারাজ</title>
    
    <style>
        body { margin: 0; padding: 0; background-color: #f4f4f6; font-family: Arial, sans-serif; overflow-x: hidden; }
        
        /* Navbar */
        .navbar { background-color: #f85606; padding: 15px 20px; display: flex; align-items: center; justify-content: space-between; color: white; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .logo { font-size: 24px; font-weight: bold; color: white; text-decoration: none; }
        .nav-links { display: flex; align-items: center; gap: 20px; }
        .nav-links a { text-decoration: none; font-weight: bold; font-size: 15px; color: white; display: flex; align-items: center; gap: 5px; }
        
        /* Game Container */
        .game-wrapper { display: flex; justify-content: center; padding: 40px 20px; min-height: calc(100vh - 150px); align-items: center; }
        .game-board { background-color: #1e2024; border-radius: 16px; width: 100%; max-width: 950px; display: flex; box-shadow: 0 20px 50px rgba(0,0,0,0.5); overflow: hidden; flex-wrap: wrap; border: 1px solid #333;}
        
        /* Left Panel - Realistic Wheel */
        .wheel-panel { flex: 1.5; padding: 50px 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; min-width: 340px; background: radial-gradient(circle, #2a2d34 0%, #1e2024 100%); border-right: 1px solid #111;}
        
        .wheel-container { position: relative; width: 340px; height: 340px; margin-bottom: 20px; border-radius: 50%;}
        
        /* 3D Outer Rim with Pegs */
        .wheel-rim { position: absolute; top: -15px; left: -15px; width: calc(100% + 30px); height: calc(100% + 30px); border-radius: 50%; border: 15px solid #111; box-shadow: 0 15px 30px rgba(0,0,0,0.6), inset 0 0 15px rgba(0,0,0,0.9); z-index: 15; pointer-events: none; }
        .wheel-pegs { position: absolute; top: -7px; left: -7px; width: calc(100% + 14px); height: calc(100% + 14px); border-radius: 50%; border: 5px dotted #666; z-index: 16; pointer-events: none; opacity: 0.5;}

        /* Realistic Pointer */
        .pointer { position: absolute; top: -35px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 18px solid transparent; border-right: 18px solid transparent; border-top: 35px solid #f1c40f; z-index: 25; filter: drop-shadow(0 6px 4px rgba(0,0,0,0.5)); transition: 0.1s;}
        .pointer::after { content: ''; position: absolute; top: -35px; left: -6px; width: 12px; height: 12px; background: #333; border-radius: 50%; box-shadow: inset 0 2px 5px rgba(255,255,255,0.3);}

        /* The Spinning Wheel */
        .wheel {
            width: 100%; height: 100%; border-radius: 50%; position: relative; overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            background: conic-gradient(from -22.5deg,
                #ff4757 0deg 45deg,    
                #2ed573 45deg 90deg,   
                #ff4757 90deg 135deg,  
                #1e90ff 135deg 180deg, 
                #ffa502 180deg 225deg, 
                #9b59b6 225deg 270deg, 
                #ff4757 270deg 315deg, 
                #1abc9c 315deg 360deg  
            );
            transition: transform 5s cubic-bezier(0.2, 0.8, 0.2, 1);
            transform: rotate(0deg);
        }

        /* Lines between slices */
        .wheel-lines {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 50%;
            background: repeating-conic-gradient(from -22.5deg, rgba(0,0,0,0) 0deg, rgba(0,0,0,0) calc(45deg - 3px), rgba(0,0,0,0.4) calc(45deg - 3px), rgba(0,0,0,0.4) 45deg);
            z-index: 2;
        }

        /* Metallic Center Hub */
        .wheel-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 70px; height: 70px; background: radial-gradient(circle, #444 0%, #111 100%); border-radius: 50%; border: 5px solid #222; box-shadow: 0 5px 15px rgba(0,0,0,0.8), inset 0 2px 5px rgba(255,255,255,0.2); z-index: 10; display: flex; justify-content: center; align-items: center; color: #f1c40f; font-weight: bold; font-size: 26px; text-shadow: 0 2px 4px rgba(0,0,0,0.8);}
        
        /* Wheel Text Alignment */
        .label { position: absolute; top: 50%; left: 50%; width: 50%; height: 30px; margin-top: -15px; transform-origin: left center; text-align: right; padding-right: 30px; box-sizing: border-box; font-size: 20px; font-weight: bold; color: #fff; text-shadow: 1px 1px 4px rgba(0,0,0,0.9); z-index: 3; display: flex; justify-content: flex-end; align-items: center; font-family: 'Arial Black', sans-serif;}
        .lbl-0 { transform: rotate(-90deg); }
        .lbl-1 { transform: rotate(-45deg); }
        .lbl-2 { transform: rotate(0deg); }
        .lbl-3 { transform: rotate(45deg); }
        .lbl-4 { transform: rotate(90deg); }
        .lbl-5 { transform: rotate(135deg); }
        .lbl-6 { transform: rotate(180deg); }
        .lbl-7 { transform: rotate(225deg); }

        /* Right Panel - Controls */
        .controls-panel { padding: 50px 40px; flex: 1; min-width: 300px; background-color: #23262b; color: #fff; display: flex; flex-direction: column; justify-content: center; border-left: 1px solid #333; box-shadow: inset 20px 0 20px -20px rgba(0,0,0,0.5);}
        .controls-panel h3 { color: #f85606; margin-top: 0; margin-bottom: 35px; font-size: 26px; text-transform: uppercase; letter-spacing: 1px; text-align: center; text-shadow: 0 2px 5px rgba(0,0,0,0.5);}
        
        .input-group { margin-bottom: 25px; }
        .input-group label { display: block; margin-bottom: 10px; font-size: 13px; color: #aaa; text-transform: uppercase; font-weight: bold; letter-spacing: 1px;}
        .input-box { display: flex; background: #16181b; border-radius: 8px; overflow: hidden; border: 2px solid #3d4046; transition: 0.3s; box-shadow: inset 0 3px 10px rgba(0,0,0,0.3);}
        .input-box:focus-within { border-color: #f85606; box-shadow: inset 0 3px 10px rgba(0,0,0,0.3), 0 0 10px rgba(248,86,6,0.3);}
        .currency-tag { background: #333; padding: 15px 20px; color: #fff; font-weight: bold; font-size: 18px; border-right: 1px solid #444;}
        .input-box input { flex: 1; background: transparent; border: none; color: #fff; padding: 15px; font-size: 22px; outline: none; font-weight: bold; text-align: center;}
        
        /* Spin & Withdraw Buttons */
        .spin-btn { width: 100%; background: linear-gradient(to bottom, #ff6b1a, #e64a00); border: 1px solid #c93e00; color: white; padding: 20px; border-radius: 8px; font-size: 22px; font-weight: bold; cursor: pointer; transition: 0.2s; box-shadow: 0 6px 0 #b33600, 0 10px 15px rgba(0,0,0,0.4); text-transform: uppercase; letter-spacing: 2px; margin-top: 15px; text-shadow: 0 2px 3px rgba(0,0,0,0.3);}
        .spin-btn:active { transform: translateY(6px); box-shadow: 0 0px 0 #b33600, 0 4px 5px rgba(0,0,0,0.4); }
        .spin-btn:disabled { background: #555; border-color:#444; box-shadow: 0 6px 0 #333; cursor: not-allowed; color: #999;}
        .spin-btn:disabled:active { transform: none; box-shadow: 0 6px 0 #333; }

        /* 🌟 New Withdraw Button Style */
        .withdraw-btn { width: 100%; background: linear-gradient(to bottom, #2ecc71, #27ae60); border: 1px solid #219653; color: white; padding: 15px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; box-shadow: 0 6px 0 #1e8449, 0 10px 15px rgba(0,0,0,0.4); text-transform: uppercase; letter-spacing: 1px; margin-top: 20px; text-shadow: 0 1px 2px rgba(0,0,0,0.3);}
        .withdraw-btn:active { transform: translateY(6px); box-shadow: 0 0px 0 #1e8449, 0 4px 5px rgba(0,0,0,0.4); }

        /* Recent Result Display */
        .result-box { margin-top: 30px; background: #16181b; padding: 20px; border-radius: 8px; text-align: center; border: 1px dashed #444; box-shadow: inset 0 5px 15px rgba(0,0,0,0.4);}
        .result-title { font-size: 14px; color: #888; text-transform: uppercase; margin-bottom: 10px; font-weight: bold; letter-spacing: 1px;}
        .result-amount { font-size: 32px; font-weight: bold; color: #fff; text-shadow: 0 2px 5px rgba(0,0,0,0.5); }
        
        /* 🌟 Dark Modal for Withdraw */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 5000; justify-content: center; align-items: center; }
        .modal-content.dark-modal { background: #26292e; color: #fff; padding: 30px; border-radius: 12px; max-width: 400px; width: 90%; position: relative; border: 1px solid #444; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: left; animation: fadeIn 0.3s; }
        .dark-modal h3 { text-align: center; color: #2ecc71; margin-top: 0; font-size: 22px; text-transform: uppercase; border-bottom: 1px dashed #444; padding-bottom: 15px; margin-bottom: 20px;}
        .dark-modal label { display: block; margin-bottom: 5px; color: #aaa; font-weight: bold; font-size: 13px; text-transform: uppercase;}
        .dark-modal input, .dark-modal select { width: 100%; padding: 12px; background: #16181b; border: 1px solid #3d4046; color: white; border-radius: 6px; margin-bottom: 20px; font-size: 15px; outline: none; box-sizing: border-box;}
        .dark-modal input:focus, .dark-modal select:focus { border-color: #2ecc71; }
        .close-btn { position: absolute; top: 10px; right: 15px; font-size: 28px; cursor: pointer; color: #aaa; transition: 0.3s; }
        .close-btn:hover { color: #e74c3c; }

        /* Toast Notification */
        .toast-notification { visibility: hidden; min-width: 280px; background-color: #333; color: #fff; text-align: center; border-radius: 6px; padding: 16px; position: fixed; z-index: 6000; left: 50%; top: 30px; transform: translateX(-50%); font-size: 16px; font-weight: bold; box-shadow: 0 5px 15px rgba(0,0,0,0.2); opacity: 0; transition: opacity 0.3s, top 0.3s; }
        .toast-notification.show { visibility: visible; opacity: 1; top: 50px; }
        .toast-success { background-color: #28a745; }
        .toast-error { background-color: #e74c3c; }
        .toast-warning { background-color: #f39c12; color: #fff; }

        @media (max-width: 768px) {
            .game-board { flex-direction: column; }
            .wheel-panel { border-right: none; border-bottom: 1px solid #111; padding: 40px 20px;}
            .wheel-container { width: 280px; height: 280px; }
            .controls-panel { padding: 40px 20px; box-shadow: none; border-left: none;}
            .label { font-size: 16px; }
            .pointer { top: -25px; border-left-width: 15px; border-right-width: 15px; border-top-width: 25px; }
        }
    </style>
</head>
<body>

    <div id="toast" class="toast-notification">Notification text</div>

    <!-- 🌟 Withdraw Modal -->
    <div class="modal-overlay" id="withdrawModal">
        <div class="modal-content dark-modal">
            <span class="close-btn" id="closeWithdrawModal">&times;</span>
            <h3>💸 উইথড্র করুন</h3>
            
            <label>পেমেন্ট মেথড:</label>
            <select id="w-method">
                <option value="bKash">bKash (বিকাশ)</option>
                <option value="Nagad">Nagad (নগদ)</option>
                <option value="Rocket">Rocket (রকেট)</option>
                <option value="Upay">Upay (উপায়)</option>
            </select>

            <label>আপনার অ্যাকাউন্ট নাম্বার:</label>
            <input type="text" id="w-number" placeholder="যেমন: 01XXXXXXXXX" autocomplete="off">

            <label>টাকার পরিমাণ (৳):</label>
            <input type="number" id="w-amount" placeholder="সর্বনিম্ন ৫০ টাকা" min="50">

            <button class="withdraw-btn" id="submitWithdrawBtn" style="margin-top: 5px;">উইথড্র রিকোয়েস্ট পাঠান</button>
        </div>
    </div>

    <!-- Navbar -->
    <nav class="navbar">
        <a href="index.html" class="logo">AmarDaraz</a>
        <div class="nav-links">
            <a href="#" id="balance-display">💰 ব্যালেন্স: ৳ 0</a>
            <a href="index.html" style="background: white; color: #f85606; padding: 8px 15px; border-radius: 20px;">হোমে ফিরুন</a>
        </div>
    </nav>

    <!-- Game Area -->
    <div class="game-wrapper">
        <div class="game-board">
            
            <!-- Left Panel (Realistic Wheel) -->
            <div class="wheel-panel">
                <div class="wheel-container">
                    <div class="pointer"></div>
                    <div class="wheel-rim">
                        <div class="wheel-pegs"></div>
                    </div>
                    
                    <div class="wheel" id="wheel">
                        <div class="wheel-lines"></div>
                        <!-- Slices -->
                        <div class="label lbl-0">0x</div>
                        <div class="label lbl-1">1.5x</div>
                        <div class="label lbl-2">0x</div>
                        <div class="label lbl-3">2x</div>
                        <div class="label lbl-4">0.5x</div>
                        <div class="label lbl-5">5x</div>
                        <div class="label lbl-6">0x</div>
                        <div class="label lbl-7">1.2x</div>
                        
                        <div class="wheel-center">৳</div>
                    </div>
                </div>
            </div>

            <!-- Right Panel (Controls) -->
            <div class="controls-panel">
                <h3>🎰 Lucky Spin 🎰</h3>
                
                <div class="input-group">
                    <label>বেটের পরিমাণ (Bet Amount)</label>
                    <div class="input-box">
                        <div class="currency-tag">৳</div>
                        <input type="number" id="bet-amount" value="20" min="1" step="1">
                    </div>
                </div>

                <button class="spin-btn" id="spin-btn">SPIN NOW!</button>

                <!-- 🌟 New Withdraw Button -->
                <button class="withdraw-btn" id="open-withdraw-btn">💸 উইথড্র (Withdraw)</button>

                <div class="result-box">
                    <div class="result-title">সর্বশেষ ফলাফল</div>
                    <div class="result-amount" id="result-text">--</div>
                </div>
            </div>

        </div>
    </div>

    <!-- Firebase & JavaScript -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, updateDoc, collection, addDoc } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBZNrrK7MLGIZoPakMgj2yFEX7iCVYYhlg",
            authDomain: "amrdraz-d0682.firebaseapp.com",
            projectId: "amrdraz-d0682",
            storageBucket: "amrdraz-d0682.firebasestorage.app",
            messagingSenderId: "690289096145",
            appId: "1:690289096145:web:dbebaa4e60203a7922dcf0"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Elements
        const balanceDisplay = document.getElementById("balance-display");
        const betInput = document.getElementById("bet-amount");
        const wheel = document.getElementById("wheel");
        const spinBtn = document.getElementById("spin-btn");
        const resultText = document.getElementById("result-text");
        
        // 🌟 Withdraw Modal Elements
        const withdrawModal = document.getElementById("withdrawModal");
        const openWithdrawBtn = document.getElementById("open-withdraw-btn");
        const closeWithdrawModal = document.getElementById("closeWithdrawModal");
        const submitWithdrawBtn = document.getElementById("submitWithdrawBtn");

        let currentUserEmail = null;
        let currentBalance = 0;
        let isSpinning = false;
        let currentRotation = 0;

        const slices = [
            { mult: 0,   name: "0x (Loss)" },
            { mult: 1.5, name: "1.5x (Win)" },
            { mult: 0,   name: "0x (Loss)" },
            { mult: 2.0, name: "2x (Win)" },
            { mult: 0.5, name: "0.5x (Partial)" },
            { mult: 5.0, name: "5x (JACKPOT!)" },
            { mult: 0,   name: "0x (Loss)" },
            { mult: 1.2, name: "1.2x (Win)" }
        ];

        function showToast(message, type = "success") {
            const toast = document.getElementById("toast");
            toast.innerText = message;
            toast.className = "toast-notification show";
            if(type === "error") toast.classList.add("toast-error");
            else if (type === "warning") toast.classList.add("toast-warning");
            else toast.classList.add("toast-success");

            setTimeout(() => { toast.className = "toast-notification"; }, 3500);
        }

        // Authentication
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUserEmail = user.email;
                fetchBalance();
            } else {
                showToast("আপনাকে প্রথমে লগইন করতে হবে!", "warning");
                setTimeout(() => { window.location.href = "login.html"; }, 1500);
            }
        });

        async function fetchBalance() {
            try {
                const userDoc = await getDoc(doc(db, "users", currentUserEmail));
                if (userDoc.exists()) {
                    currentBalance = parseFloat(userDoc.data().balance || 0);
                    balanceDisplay.innerText = `💰 ব্যালেন্স: ৳ ${currentBalance.toFixed(2)}`;
                }
            } catch (e) {
                console.error(e);
            }
        }

        // 🌟 Withdraw Modal Logic
        openWithdrawBtn.addEventListener('click', () => { withdrawModal.style.display = 'flex'; });
        closeWithdrawModal.addEventListener('click', () => { withdrawModal.style.display = 'none'; });
        window.addEventListener('click', (e) => { if (e.target === withdrawModal) withdrawModal.style.display = 'none'; });

        submitWithdrawBtn.addEventListener('click', async () => {
            let wAmount = parseFloat(document.getElementById('w-amount').value);
            let wMethod = document.getElementById('w-method').value;
            let wNumber = document.getElementById('w-number').value.trim();

            if (!wAmount || wAmount < 50) { showToast("সর্বনিম্ন ৫০ টাকা উইথড্র করা যাবে!", "warning"); return; }
            if (!wNumber) { showToast("আপনার অ্যাকাউন্ট নাম্বারটি দিন!", "warning"); return; }
            if (wAmount > currentBalance) { showToast("❌ আপনার অ্যাকাউন্টে পর্যাপ্ত ব্যালেন্স নেই!", "error"); return; }

            submitWithdrawBtn.disabled = true;
            submitWithdrawBtn.innerText = "রিকোয়েস্ট পাঠানো হচ্ছে...";

            try {
                // ব্যালেন্স কাটা
                currentBalance -= wAmount;
                balanceDisplay.innerText = `💰 ব্যালেন্স: ৳ ${currentBalance.toFixed(2)}`;
                await updateDoc(doc(db, "users", currentUserEmail), { balance: currentBalance });

                // রিকোয়েস্ট ডাটাবেসে সেভ
                await addDoc(collection(db, "withdrawals"), {
                    userEmail: currentUserEmail,
                    amount: wAmount,
                    method: wMethod,
                    accountNumber: wNumber,
                    status: "Pending",
                    timestamp: new Date().toISOString()
                });

                showToast("✅ আপনার উইথড্র রিকোয়েস্ট সফল হয়েছে!", "success");
                withdrawModal.style.display = 'none';
                
                // Form Reset
                document.getElementById('w-amount').value = '';
                document.getElementById('w-number').value = '';
            } catch(e) {
                console.error(e);
                showToast("❌ সমস্যা হয়েছে! আবার চেষ্টা করুন।", "error");
            }

            submitWithdrawBtn.disabled = false;
            submitWithdrawBtn.innerText = "উইথড্র রিকোয়েস্ট পাঠান";
        });

        // Spin Game Logic
        spinBtn.addEventListener('click', async () => {
            if (isSpinning) return;
            
            let betAmount = parseFloat(betInput.value) || 0;

            if (betAmount <= 0) { showToast("দয়া করে সঠিক বেট অ্যামাউন্ট দিন!", "warning"); return; }
            if (betAmount > currentBalance) { showToast("❌ আপনার অ্যাকাউন্টে পর্যাপ্ত ব্যালেন্স নেই!", "error"); return; }

            isSpinning = true;
            spinBtn.disabled = true;
            spinBtn.innerText = "SPINNING...";
            resultText.innerText = "ঘুরছে...";
            resultText.style.color = "#aaa";
            
            try {
                currentBalance -= betAmount;
                balanceDisplay.innerText = `💰 ব্যালেন্স: ৳ ${currentBalance.toFixed(2)}`;
                const userRef = doc(db, "users", currentUserEmail);
                await updateDoc(userRef, { balance: currentBalance });

                const randomSliceIndex = Math.floor(Math.random() * 8); 
                const targetSlice = slices[randomSliceIndex];
                
                const randomOffset = Math.floor(Math.random() * 30) - 15; 
                const targetAngle = 360 - (randomSliceIndex * 45) + randomOffset;
                
                const spins = 360 * 6; 
                const currentMod = currentRotation % 360;
                const rotationNeeded = (360 - currentMod) + spins + targetAngle;
                
                currentRotation += rotationNeeded;
                wheel.style.transform = `rotate(${currentRotation}deg)`;

                setTimeout(async () => {
                    const payout = betAmount * targetSlice.mult;

                    if (targetSlice.mult > 0) {
                        resultText.innerText = `+ ৳ ${payout.toFixed(2)}`;
                        resultText.style.color = "#2ecc71"; 
                        
                        if(targetSlice.mult >= 2) {
                            showToast(`🎉 জ্যাকপট! আপনি ${targetSlice.mult}x পেয়েছেন!`, "success");
                        } else {
                            showToast(`✅ আপনি জিতেছেন ৳ ${payout.toFixed(2)}!`, "success");
                        }

                        currentBalance += payout;
                        balanceDisplay.innerText = `💰 ব্যালেন্স: ৳ ${currentBalance.toFixed(2)}`;
                        await updateDoc(userRef, { balance: currentBalance });
                    } else {
                        resultText.innerText = `হেরেছেন ৳ ${betAmount.toFixed(2)}`;
                        resultText.style.color = "#e74c3c"; 
                        showToast(`😢 আপনি হেরে গেছেন! আবার চেষ্টা করুন।`, "error");
                    }

                    isSpinning = false;
                    spinBtn.disabled = false;
                    spinBtn.innerText = "SPIN AGAIN!";
                }, 5000); 
                
            } catch(e) {
                showToast("সার্ভার এরর! গেম খেলা যাচ্ছে না।", "error");
                isSpinning = false;
                spinBtn.disabled = false;
                spinBtn.innerText = "SPIN NOW!";
            }
        });
    </script>
</body>
</html>
