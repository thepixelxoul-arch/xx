<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>লাকি স্পিন হুইল - আমার দারাজ</title>
    
    <style>
        body { margin: 0; padding: 0; background-color: #f4f4f6; font-family: Arial, sans-serif; overflow-x: hidden; }
        
        /* Navbar */
        .navbar { background-color: #f85606; padding: 15px 20px; display: flex; align-items: center; justify-content: space-between; color: white; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .logo { font-size: 24px; font-weight: bold; color: white; text-decoration: none; }
        .nav-links { display: flex; align-items: center; gap: 20px; }
        .nav-links a { text-decoration: none; font-weight: bold; font-size: 15px; color: white; display: flex; align-items: center; gap: 5px; }
        
        /* Game Container - Light Theme */
        .game-wrapper { display: flex; justify-content: center; padding: 40px 20px; min-height: calc(100vh - 150px); align-items: center; }
        .game-board { background-color: #ffffff; border-radius: 12px; width: 100%; max-width: 950px; display: flex; box-shadow: 0 8px 25px rgba(0,0,0,0.08); overflow: hidden; flex-wrap: wrap; border: 1px solid #eee;}
        
        /* Left Panel - Flat Clean Wheel */
        .wheel-panel { flex: 1.5; padding: 40px 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; min-width: 320px; background-color: #ffffff; border-right: 1px solid #eee;}
        
        /* 🌟 Cute Orange Wheel Border */
        .wheel-container { position: relative; width: 340px; height: 340px; margin-bottom: 20px; border-radius: 50%; padding: 10px; background: #f85606; box-shadow: 0 8px 20px rgba(248,86,6,0.2); }
        .wheel-container::before { content: ''; position: absolute; top: 6px; left: 6px; right: 6px; bottom: 6px; border-radius: 50%; border: 3px dotted #ffd1b3; opacity: 0.8; pointer-events: none; }

        /* 🌟 Bright Colorful Slices (12 Slices) */
        .wheel {
            width: 100%; height: 100%; border-radius: 50%; position: relative; overflow: hidden;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
            /* 12 Slices - 30 deg each (Starting from -15deg so top is perfectly centered) */
            background: conic-gradient(from -15deg,
                #ff4d4f 0deg 30deg,    /* 0x */
                #2ed573 30deg 60deg,   /* 1.5x */
                #ff4d4f 60deg 90deg,   /* 0x */
                #1e90ff 90deg 120deg,  /* 2x */
                #ff4d4f 120deg 150deg, /* 0x */
                #eccc68 150deg 180deg, /* 0.5x */
                #ff4d4f 180deg 210deg, /* 0x */
                #9b59b6 210deg 240deg, /* 3x */
                #ff4d4f 240deg 270deg, /* 0x */
                #1abc9c 270deg 300deg, /* 1.2x */
                #ff4d4f 300deg 330deg, /* 0x */
                #ffa502 330deg 360deg  /* 5x */
            );
            transition: transform 5s cubic-bezier(0.2, 0.8, 0.2, 1);
            transform: rotate(0deg);
        }

        /* Clean White Lines */
        .wheel-lines { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 50%; background: repeating-conic-gradient(from -15deg, rgba(255,255,255,0) 0deg, rgba(255,255,255,0) calc(30deg - 2px), rgba(255,255,255,0.7) calc(30deg - 2px), rgba(255,255,255,0.7) 30deg); z-index: 2; pointer-events: none;}

        /* 🌟 Label Text Positions (12 labels) */
        .label { position: absolute; top: 50%; left: 50%; width: 50%; height: 24px; margin-top: -12px; transform-origin: left center; text-align: right; padding-right: 20px; box-sizing: border-box; font-size: 16px; font-weight: bold; color: #fff; text-shadow: 1px 1px 2px rgba(0,0,0,0.5); z-index: 3; display: flex; justify-content: flex-end; align-items: center; font-family: Arial, sans-serif;}
        .lbl-0 { transform: rotate(-90deg); }
        .lbl-1 { transform: rotate(-60deg); }
        .lbl-2 { transform: rotate(-30deg); }
        .lbl-3 { transform: rotate(0deg); }
        .lbl-4 { transform: rotate(30deg); }
        .lbl-5 { transform: rotate(60deg); }
        .lbl-6 { transform: rotate(90deg); }
        .lbl-7 { transform: rotate(120deg); }
        .lbl-8 { transform: rotate(150deg); }
        .lbl-9 { transform: rotate(180deg); }
        .lbl-10 { transform: rotate(210deg); }
        .lbl-11 { transform: rotate(240deg); }

        /* 🌟 Inner Pointer & Center Hub (Fixed in center) */
        .wheel-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 65px; height: 65px; background: #fff; border-radius: 50%; border: 4px solid #f85606; box-shadow: 0 4px 10px rgba(0,0,0,0.3); z-index: 10; display: flex; justify-content: center; align-items: center; color: #f85606; font-weight: bold; font-size: 24px;}
        
        .center-pointer { position: absolute; top: -28px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 14px solid transparent; border-right: 14px solid transparent; border-bottom: 28px solid #f85606; z-index: -1; filter: drop-shadow(0 -2px 3px rgba(0,0,0,0.3));}

        /* Right Panel - Controls (Light Theme) */
        .controls-panel { padding: 40px 30px; flex: 1; min-width: 300px; background-color: #fafafa; color: #333; display: flex; flex-direction: column; justify-content: center; border-left: 1px solid #eee;}
        .controls-panel h3 { color: #f85606; margin-top: 0; margin-bottom: 30px; font-size: 24px; text-transform: uppercase; font-weight: bold; text-align: center; }
        
        .input-group { margin-bottom: 25px; }
        .input-group label { display: block; margin-bottom: 8px; font-size: 13px; color: #555; text-transform: uppercase; font-weight: bold; }
        .input-box { display: flex; background: #fff; border-radius: 6px; overflow: hidden; border: 1px solid #ccc; transition: 0.3s;}
        .input-box:focus-within { border-color: #f85606; box-shadow: 0 0 8px rgba(248,86,6,0.2);}
        .currency-tag { background: #eee; padding: 12px 15px; color: #333; font-weight: bold; font-size: 16px; border-right: 1px solid #ccc;}
        .input-box input { flex: 1; background: transparent; border: none; color: #333; padding: 12px; font-size: 20px; outline: none; font-weight: bold; text-align: center;}
        
        /* Flat E-commerce Buttons */
        .spin-btn { width: 100%; background: #f85606; border: none; color: white; padding: 15px; border-radius: 6px; font-size: 20px; font-weight: bold; cursor: pointer; transition: 0.3s; text-transform: uppercase; letter-spacing: 1px;}
        .spin-btn:hover { background: #d84a05; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(248,86,6,0.3); }
        .spin-btn:disabled { background: #ccc; cursor: not-allowed; transform: none; box-shadow: none; color: #fff;}

        .withdraw-btn { width: 100%; background: #2ecc71; border: none; color: white; padding: 12px; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 15px;}
        .withdraw-btn:hover { background: #27ae60; transform: translateY(-2px); box-shadow: 0 4px 10px rgba(46,204,113,0.3); }

        /* Result Box Light */
        .result-box { margin-top: 30px; background: #fff; padding: 20px; border-radius: 8px; text-align: center; border: 1px dashed #ccc; box-shadow: 0 2px 8px rgba(0,0,0,0.05);}
        .result-title { font-size: 13px; color: #777; text-transform: uppercase; margin-bottom: 10px; font-weight: bold;}
        .result-amount { font-size: 28px; font-weight: bold; color: #f85606; }
        
        /* Light Modal for Withdraw */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 5000; justify-content: center; align-items: center; }
        .modal-content { background: #fff; color: #333; padding: 30px; border-radius: 8px; max-width: 400px; width: 90%; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.2); text-align: left; animation: fadeIn 0.3s; }
        .modal-content h3 { text-align: center; color: #f85606; margin-top: 0; font-size: 20px; border-bottom: 1px solid #eee; padding-bottom: 15px; margin-bottom: 20px;}
        .modal-content label { display: block; margin-bottom: 5px; color: #555; font-weight: bold; font-size: 13px;}
        .modal-content input, .modal-content select { width: 100%; padding: 12px; background: #fafafa; border: 1px solid #ccc; color: #333; border-radius: 4px; margin-bottom: 20px; font-size: 14px; outline: none; box-sizing: border-box;}
        .modal-content input:focus, .modal-content select:focus { border-color: #f85606; }
        .close-btn { position: absolute; top: 10px; right: 15px; font-size: 28px; cursor: pointer; color: #999; transition: 0.3s; }
        .close-btn:hover { color: #f85606; }

        /* Toast Notification */
        .toast-notification { visibility: hidden; min-width: 280px; background-color: #333; color: #fff; text-align: center; border-radius: 6px; padding: 16px; position: fixed; z-index: 6000; left: 50%; top: 30px; transform: translateX(-50%); font-size: 16px; font-weight: bold; box-shadow: 0 5px 15px rgba(0,0,0,0.2); opacity: 0; transition: opacity 0.3s, top 0.3s; }
        .toast-notification.show { visibility: visible; opacity: 1; top: 50px; }
        .toast-success { background-color: #28a745; }
        .toast-error { background-color: #e74c3c; }
        .toast-warning { background-color: #f39c12; color: #fff; }

        @media (max-width: 768px) {
            .game-board { flex-direction: column; }
            .wheel-panel { border-right: none; border-bottom: 1px solid #eee; padding: 30px 20px;}
            .wheel-container { width: 300px; height: 300px; }
            .controls-panel { padding: 30px 20px; }
            .label { font-size: 14px; padding-right: 15px;}
        }
    </style>
</head>
<body>

    <div id="toast" class="toast-notification">Notification text</div>

    <!-- Withdraw Modal -->
    <div class="modal-overlay" id="withdrawModal">
        <div class="modal-content">
            <span class="close-btn" id="closeWithdrawModal">&times;</span>
            <h3>💸 উইথড্র করুন</h3>
            
            <label>পেমেন্ট মেথড:</label>
            <select id="w-method">
                <option value="bKash">bKash (বিকাশ)</option>
                <option value="Nagad">Nagad (নগদ)</option>
                <option value="Rocket">Rocket (রকেট)</option>
                <option value="Upay">Upay (উপায়)</option>
            </select>

            <label>আপনার অ্যাকাউন্ট নাম্বার:</label>
            <input type="text" id="w-number" placeholder="যেমন: 01XXXXXXXXX" autocomplete="off">

            <label>টাকার পরিমাণ (৳):</label>
            <input type="number" id="w-amount" placeholder="সর্বনিম্ন ৫০ টাকা" min="50">

            <button class="withdraw-btn" id="submitWithdrawBtn" style="margin-top: 5px;">উইথড্র রিকোয়েস্ট পাঠান</button>
        </div>
    </div>

    <!-- Navbar -->
    <nav class="navbar">
        <a href="index.html" class="logo">AmarDaraz</a>
        <div class="nav-links">
            <a href="#" id="balance-display">💰 ব্যালেন্স: ৳ 0</a>
            <a href="index.html" style="background: white; color: #f85606; padding: 8px 15px; border-radius: 20px;">হোমে ফিরুন</a>
        </div>
    </nav>

    <!-- Game Area -->
    <div class="game-wrapper">
        <div class="game-board">
            
            <!-- Left Panel (Flat E-commerce Wheel) -->
            <div class="wheel-panel">
                <div class="wheel-container">
                    
                    <div class="wheel" id="wheel">
                        <div class="wheel-lines"></div>
                        <!-- 🌟 12 Slices -->
                        <div class="label lbl-0">0x</div>
                        <div class="label lbl-1">1.5x</div>
                        <div class="label lbl-2">0x</div>
                        <div class="label lbl-3">2x</div>
                        <div class="label lbl-4">0x</div>
                        <div class="label lbl-5">0.5x</div>
                        <div class="label lbl-6">0x</div>
                        <div class="label lbl-7">3x</div>
                        <div class="label lbl-8">0x</div>
                        <div class="label lbl-9">1.2x</div>
                        <div class="label lbl-10">0x</div>
                        <div class="label lbl-11">5x</div>
                    </div>
                    
                    <!-- 🌟 Center Hub with Pointer Inside pointing Up -->
                    <div class="wheel-center">
                        <div class="center-pointer"></div>
                        ৳
                    </div>
                    
                </div>
            </div>

            <!-- Right Panel (Light Controls) -->
            <div class="controls-panel">
                <h3>🎰 Lucky Spin 🎰</h3>
                
                <div class="input-group">
                    <label>বেটের পরিমাণ (Bet Amount)</label>
                    <div class="input-box">
                        <div class="currency-tag">৳</div>
                        <input type="number" id="bet-amount" value="20" min="1" step="1">
                    </div>
                </div>

                <button class="spin-btn" id="spin-btn">SPIN NOW!</button>

                <!-- Withdraw Button -->
                <button class="withdraw-btn" id="open-withdraw-btn">💸 উইথড্র (WITHDRAW)</button>

                <div class="result-box">
                    <div class="result-title">সর্বশেষ ফলাফল</div>
                    <div class="result-amount" id="result-text">--</div>
                </div>
            </div>

        </div>
    </div>

    <!-- Firebase & JavaScript -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, updateDoc, collection, addDoc } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBZNrrK7MLGIZoPakMgj2yFEX7iCVYYhlg",
            authDomain: "amrdraz-d0682.firebaseapp.com",
            projectId: "amrdraz-d0682",
            storageBucket: "amrdraz-d0682.firebasestorage.app",
            messagingSenderId: "690289096145",
            appId: "1:690289096145:web:dbebaa4e60203a7922dcf0"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Elements
        const balanceDisplay = document.getElementById("balance-display");
        const betInput = document.getElementById("bet-amount");
        const wheel = document.getElementById("wheel");
        const spinBtn = document.getElementById("spin-btn");
        const resultText = document.getElementById("result-text");
        
        const withdrawModal = document.getElementById("withdrawModal");
        const openWithdrawBtn = document.getElementById("open-withdraw-btn");
        const closeWithdrawModal = document.getElementById("closeWithdrawModal");
        const submitWithdrawBtn = document.getElementById("submitWithdrawBtn");

        let currentUserEmail = null;
        let currentBalance = 0;
        let isSpinning = false;
        let currentRotation = 0;

        // 🌟 12 Wheel Slices Data
        const slices = [
            { mult: 0,   name: "0x (Loss)" },
            { mult: 1.5, name: "1.5x (Win)" },
            { mult: 0,   name: "0x (Loss)" },
            { mult: 2.0, name: "2x (Win)" },
            { mult: 0,   name: "0x (Loss)" },
            { mult: 0.5, name: "0.5x (Partial)" },
            { mult: 0,   name: "0x (Loss)" },
            { mult: 3.0, name: "3x (Super Win)" },
            { mult: 0,   name: "0x (Loss)" },
            { mult: 1.2, name: "1.2x (Win)" },
            { mult: 0,   name: "0x (Loss)" },
            { mult: 5.0, name: "5x (JACKPOT!)" }
        ];

        function showToast(message, type = "success") {
            const toast = document.getElementById("toast");
            toast.innerText = message;
            toast.className = "toast-notification show";
            if(type === "error") toast.classList.add("toast-error");
            else if (type === "warning") toast.classList.add("toast-warning");
            else toast.classList.add("toast-success");

            setTimeout(() => { toast.className = "toast-notification"; }, 3500);
        }

        // Authentication
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUserEmail = user.email;
                fetchBalance();
            } else {
                showToast("আপনাকে প্রথমে লগইন করতে হবে!", "warning");
                setTimeout(() => { window.location.href = "login.html"; }, 1500);
            }
        });

        async function fetchBalance() {
            try {
                const userDoc = await getDoc(doc(db, "users", currentUserEmail));
                if (userDoc.exists()) {
                    currentBalance = parseFloat(userDoc.data().balance || 0);
                    balanceDisplay.innerText = `💰 ব্যালেন্স: ৳ ${currentBalance.toFixed(2)}`;
                }
            } catch (e) {
                console.error(e);
            }
        }

        // Withdraw Modal Logic
        openWithdrawBtn.addEventListener('click', () => { withdrawModal.style.display = 'flex'; });
        closeWithdrawModal.addEventListener('click', () => { withdrawModal.style.display = 'none'; });
        window.addEventListener('click', (e) => { if (e.target === withdrawModal) withdrawModal.style.display = 'none'; });

        submitWithdrawBtn.addEventListener('click', async () => {
            let wAmount = parseFloat(document.getElementById('w-amount').value);
            let wMethod = document.getElementById('w-method').value;
            let wNumber = document.getElementById('w-number').value.trim();

            if (!wAmount || wAmount < 50) { showToast("সর্বনিম্ন ৫০ টাকা উইথড্র করা যাবে!", "warning"); return; }
            if (!wNumber) { showToast("আপনার অ্যাকাউন্ট নাম্বারটি দিন!", "warning"); return; }
            if (wAmount > currentBalance) { showToast("❌ আপনার অ্যাকাউন্টে পর্যাপ্ত ব্যালেন্স নেই!", "error"); return; }

            submitWithdrawBtn.disabled = true;
            submitWithdrawBtn.innerText = "রিকোয়েস্ট পাঠানো হচ্ছে...";

            try {
                currentBalance -= wAmount;
                balanceDisplay.innerText = `💰 ব্যালেন্স: ৳ ${currentBalance.toFixed(2)}`;
                await updateDoc(doc(db, "users", currentUserEmail), { balance: currentBalance });

                await addDoc(collection(db, "withdrawals"), {
                    userEmail: currentUserEmail,
                    amount: wAmount,
                    method: wMethod,
                    accountNumber: wNumber,
                    status: "Pending",
                    timestamp: new Date().toISOString()
                });

                showToast("✅ আপনার উইথড্র রিকোয়েস্ট সফল হয়েছে!", "success");
                withdrawModal.style.display = 'none';
                
                document.getElementById('w-amount').value = '';
                document.getElementById('w-number').value = '';
            } catch(e) {
                console.error(e);
                showToast("❌ সমস্যা হয়েছে! আবার চেষ্টা করুন।", "error");
            }

            submitWithdrawBtn.disabled = false;
            submitWithdrawBtn.innerText = "উইথড্র রিকোয়েস্ট পাঠান";
        });

        // Spin Game Logic
        spinBtn.addEventListener('click', async () => {
            if (isSpinning) return;
            
            let betAmount = parseFloat(betInput.value) || 0;

            if (betAmount <= 0) { showToast("দয়া করে সঠিক বেট অ্যামাউন্ট দিন!", "warning"); return; }
            if (betAmount > currentBalance) { showToast("❌ আপনার অ্যাকাউন্টে পর্যাপ্ত ব্যালেন্স নেই!", "error"); return; }

            isSpinning = true;
            spinBtn.disabled = true;
            spinBtn.innerText = "SPINNING...";
            resultText.innerText = "ঘুরছে...";
            resultText.style.color = "#aaa";
            
            try {
                currentBalance -= betAmount;
                balanceDisplay.innerText = `💰 ব্যালেন্স: ৳ ${currentBalance.toFixed(2)}`;
                const userRef = doc(db, "users", currentUserEmail);
                await updateDoc(userRef, { balance: currentBalance });

                // 🌟 12 Slice logic
                const randomSliceIndex = Math.floor(Math.random() * 12); 
                const targetSlice = slices[randomSliceIndex];
                
                const randomOffset = Math.floor(Math.random() * 20) - 10; 
                const targetAngle = 360 - (randomSliceIndex * 30) + randomOffset;
                
                const spins = 360 * 6; 
                const currentMod = currentRotation % 360;
                const rotationNeeded = (360 - currentMod) + spins + targetAngle;
                
                currentRotation += rotationNeeded;
                wheel.style.transform = `rotate(${currentRotation}deg)`;

                setTimeout(async () => {
                    const payout = betAmount * targetSlice.mult;

                    if (targetSlice.mult > 0) {
                        resultText.innerText = `+ ৳ ${payout.toFixed(2)}`;
                        resultText.style.color = "#2ecc71"; 
                        
                        if(targetSlice.mult >= 2) {
                            showToast(`🎉 জ্যাকপট! আপনি ${targetSlice.mult}x পেয়েছেন!`, "success");
                        } else {
                            showToast(`✅ আপনি জিতেছেন ৳ ${payout.toFixed(2)}!`, "success");
                        }

                        currentBalance += payout;
                        balanceDisplay.innerText = `💰 ব্যালেন্স: ৳ ${currentBalance.toFixed(2)}`;
                        await updateDoc(userRef, { balance: currentBalance });
                    } else {
                        resultText.innerText = `হেরেছেন ৳ ${betAmount.toFixed(2)}`;
                        resultText.style.color = "#e74c3c"; 
                        showToast(`😢 আপনি হেরে গেছেন! আবার চেষ্টা করুন।`, "error");
                    }

                    isSpinning = false;
                    spinBtn.disabled = false;
                    spinBtn.innerText = "SPIN AGAIN!";
                }, 5000); 
                
            } catch(e) {
                showToast("সার্ভার এরর! গেম খেলা যাচ্ছে না।", "error");
                isSpinning = false;
                spinBtn.disabled = false;
                spinBtn.innerText = "SPIN NOW!";
            }
        });
    </script>
</body>
</html>
