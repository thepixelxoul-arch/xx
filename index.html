<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আমার দারাজ - হোম</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- বাটন পাশাপাশি বসানোর জন্য স্পেশাল ডিজাইন -->
    <style>
        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        .btn-group button { flex: 1; padding: 10px 0; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; transition: 0.3s; color: white; font-size: 14px; }
        .add-btn { background-color: #ff9900; } /* হালকা কমলা */
        .add-btn:hover { background-color: #e68a00; }
        .buy-btn { background-color: #f85606; } /* গাঢ় কমলা */
        .buy-btn:hover { background-color: #d84a05; }
    </style>
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="logo">AmarDaraz</div>
        <div class="search-bar">
            <input type="text" placeholder="প্রোডাক্ট খুঁজুন...">
            <button>Search</button>
        </div>
        <div class="nav-links">
            <a href="login.html" id="auth-link">Login / Signup</a>
            <a href="checkout.html" id="cart-link">🛒 Cart (0)</a>
        </div>
    </nav>

    <!-- Banner Section -->
    <div class="banner">
        <h2>🔥 ধামাকা অফার! সব প্রোডাক্টে ২০% ছাড়! 🔥</h2>
    </div>

    <!-- Main Content -->
    <div class="main-container">
        <h2 class="section-title">Just For You</h2>
        
        <div class="product-grid">
            
            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1598327105666-5b89351cb31b?w=300&q=80" alt="Smartphone">
                <h3>স্মার্টফোন (6GB RAM, 128GB)</h3>
                <div class="product-price">৳ ১২৫০০</div>
                <div class="btn-group">
                    <button class="add-btn">Add to Cart</button>
                    <button class="buy-btn">Buy Now</button>
                </div>
            </div>
            
            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1581655353564-df123a1eb820?w=300&q=80" alt="T-Shirt">
                <h3>সলিড সাদা কটন টি-শার্ট</h3>
                <div class="product-price">৳ ৩৫০</div>
                <div class="btn-group">
                    <button class="add-btn">Add to Cart</button>
                    <button class="buy-btn">Buy Now</button>
                </div>
            </div>
            
            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1618366712010-f4ae9c647dcb?w=300&q=80" alt="Headphone">
                <h3>ওয়্যারলেস ব্লুটুথ হেডফোন</h3>
                <div class="product-price">৳ ১২০০</div>
                <div class="btn-group">
                    <button class="add-btn">Add to Cart</button>
                    <button class="buy-btn">Buy Now</button>
                </div>
            </div>
            
            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1546868871-7041f2a55e12?w=300&q=80" alt="Smart Watch">
                <h3>ডিজিটাল স্মার্ট ওয়াচ</h3>
                <div class="product-price">৳ ৮৫০</div>
                <div class="btn-group">
                    <button class="add-btn">Add to Cart</button>
                    <button class="buy-btn">Buy Now</button>
                </div>
            </div>

            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1525966222134-fcfa99b8ae77?w=300&q=80" alt="Sneakers">
                <h3>স্টাইলিশ স্নিকার্স জুতো</h3>
                <div class="product-price">৳ ১৫০০</div>
                <div class="btn-group">
                    <button class="add-btn">Add to Cart</button>
                    <button class="buy-btn">Buy Now</button>
                </div>
            </div>

        </div>
    </div>

    <!-- Firebase & Cart JavaScript -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBZNrrK7MLGIZoPakMgj2yFEX7iCVYYhlg",
            authDomain: "amrdraz-d0682.firebaseapp.com",
            projectId: "amrdraz-d0682",
            storageBucket: "amrdraz-d0682.firebasestorage.app",
            messagingSenderId: "690289096145",
            appId: "1:690289096145:web:dbebaa4e60203a7922dcf0"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const authLink = document.getElementById("auth-link");

        onAuthStateChanged(auth, (user) => {
            if (user) {
                authLink.innerText = "Logout";
                authLink.href = "#"; 
                authLink.addEventListener("click", (e) => {
                    e.preventDefault();
                    signOut(auth).then(() => {
                        alert("আপনি সফলভাবে লগআউট হয়েছেন!");
                        window.location.reload(); 
                    });
                });
            } else {
                authLink.innerText = "Login / Signup";
                authLink.href = "login.html";
            }
        });

        // 🛒 Add to Cart এবং Buy Now সিস্টেম
        let cart = JSON.parse(localStorage.getItem("amarDarazCart")) || [];
        const cartLink = document.getElementById("cart-link");

        function updateCartCount() {
            cartLink.innerText = `🛒 Cart (${cart.length})`;
        }
        updateCartCount(); 

        // ১. Add to Cart বাটনের কাজ
        const addButtons = document.querySelectorAll(".add-btn");
        addButtons.forEach(button => {
            button.addEventListener("click", function(event) {
                const productCard = event.target.closest(".product-card");
                const productName = productCard.querySelector("h3").innerText;
                const productPrice = productCard.querySelector(".product-price").innerText;

                cart.push({ name: productName, price: productPrice });
                localStorage.setItem("amarDarazCart", JSON.stringify(cart));
                updateCartCount();

                const clickedButton = event.target;
                const originalText = clickedButton.innerText;
                
                clickedButton.innerText = "✔ যোগ হয়েছে!";
                clickedButton.style.backgroundColor = "#28a745"; 

                setTimeout(() => {
                    clickedButton.innerText = originalText;
                    clickedButton.style.backgroundColor = ""; 
                }, 1500);
            });
        });

        // ২. Buy Now বাটনের কাজ (নতুন)
        const buyButtons = document.querySelectorAll(".buy-btn");
        buyButtons.forEach(button => {
            button.addEventListener("click", function(event) {
                const productCard = event.target.closest(".product-card");
                const productName = productCard.querySelector("h3").innerText;
                const productPrice = productCard.querySelector(".product-price").innerText;

                // প্রোডাক্ট কার্টে যোগ করা
                cart.push({ name: productName, price: productPrice });
                localStorage.setItem("amarDarazCart", JSON.stringify(cart));
                
                // সাথে সাথে চেকআউট পেজে পাঠিয়ে দেওয়া
                window.location.href = "checkout.html";
            });
        });
    </script>
</body>
</html>
