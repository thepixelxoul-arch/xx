<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আমার দারাজ - হোম</title>
    <!-- আমাদের CSS ফাইল যুক্ত করা হলো -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="logo">AmarDaraz</div>
        <div class="search-bar">
            <input type="text" placeholder="প্রোডাক্ট খুঁজুন...">
            <button>Search</button>
        </div>
        <div class="nav-links">
            <a href="login.html">Login / Signup</a>
            <a href="checkout.html">🛒 Cart (0)</a>
        </div>
    </nav>

    <!-- Banner Section -->
    <div class="banner">

    </div>

    <!-- Main Content -->
    <div class="main-container">
        
        <h2 class="section-title">Just For You</h2>
        
        <!-- Products Grid -->
        <div class="product-grid">
            
            <!-- Product 1 -->
            <div class="product-card">
                <img src="https://via.placeholder.com/200" alt="Product Image">
                <h3>Смартфон XY 128GB</h3>
                <div class="product-price">৳ ১২,৫০০</div>
                <button class="add-btn">Add to Cart</button>

            <!-- Product 2 -->
            <div class="product-card">
                <img src="https://via.placeholder.com/200" alt="Product Image">
                <h3>মেনজ কটন টি-শার্ট</h3>
                <div class="product-price">৳ ৩৫০</div>
                <button class="add-btn">Add to Cart</button>

            <!-- Product 3 -->
            <div class="product-card">
                <img src="https://via.placeholder.com/200" alt="Product Image">
                <h3>ওয়্যারলেস ব্লুটুথ হেডফোন</h3>
                <div class="product-price">৳ ১,২০০</div>
                <button class="add-btn">Add to Cart</button>
            </div>

            <!-- Product 4 -->
            <div class="product-card">
                <img src="https://via.placeholder.com/200" alt="Product Image">
                <h3>ডিজিটাল স্মার্ট ওয়াচ</h3>
                <div class="product-price">৳ ৮৫০</div>
                <button class="add-btn">Add to Cart</button>
            </div>
            
        </div>
    </div>

</body>
</html>
