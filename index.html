<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আমার দারাজ - হোম</title>
    <link rel="stylesheet" href="style.css">
    
    <style>
        body { margin: 0; padding: 0; background-color: #f4f4f6; font-family: Arial, sans-serif; }
        
        .buy-btn { background-color: #f85606; color: white; padding: 10px 0; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; transition: 0.3s; font-size: 14px; width: 100%; margin-top: 10px;}
        .buy-btn:hover { background-color: #d84a05; }
        .buy-btn:disabled { background-color: #ccc; cursor: not-allowed; }
        
        .product-card img, .product-card h3 { cursor: pointer; transition: 0.3s; }
        .product-card img:hover { opacity: 0.8; }
        .product-card h3:hover { color: #f85606; }
        .product-card h3 { font-size: 15px; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .category-nav { display: flex; justify-content: center; gap: 10px; margin: 20px 10px; flex-wrap: wrap; }
        .cat-btn { padding: 10px 20px; background: #eee; border: none; border-radius: 25px; cursor: pointer; font-weight: bold; color: #555; transition: 0.3s; font-size: 14px; }
        .cat-btn:hover { background: #ffd1b3; color: #f85606; }
        .cat-btn.active { background: #f85606; color: white; box-shadow: 0 4px 10px rgba(248, 86, 6, 0.3); }

        /* Search Bar */
        .search-bar { position: relative; flex: 1; max-width: 600px; display: flex; align-items: center; background: white; border-radius: 4px; height: 42px; margin: 0 20px; }
        .search-bar input { flex: 1; height: 100%; padding: 0 15px; border: none; border-radius: 4px 0 0 4px; outline: none; font-size: 15px; color: #333; background: transparent; }
        .search-bar button { width: 50px; height: 100%; background: #ffece1; border: none; border-radius: 0 4px 4px 0; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: 0.3s; }
        .search-bar button:hover { background: #ffd1b3; }
        .search-bar button svg { width: 28px !important; height: 28px !important; }
        
        .suggestions-box { position: absolute; top: 100%; left: 0; width: calc(100% - 50px); background: white; border-radius: 0 0 8px 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-height: 250px; overflow-y: auto; z-index: 2000; display: none; margin-top: 2px; }
        .suggestion-item { padding: 12px 15px; cursor: pointer; color: #333; font-size: 14px; text-align: left; border-bottom: 1px solid #f1f1f1; display: flex; justify-content: space-between; align-items: center; }
        .suggestion-item:hover { background-color: #f9f9f9; color: #f85606; }
        .suggestion-icon { color: #ccc; font-size: 16px; font-weight: bold; }

        /* Quick View Modal */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 3000; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 25px; border-radius: 8px; max-width: 350px; width: 90%; text-align: center; position: relative; box-shadow: 0 5px 20px rgba(0,0,0,0.2); animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .close-btn { position: absolute; top: 10px; right: 15px; font-size: 24px; cursor: pointer; color: #777; transition: 0.3s; }
        .close-btn:hover { color: #f85606; }
        .modal-img { width: 100%; max-height: 200px; object-fit: cover; margin-bottom: 10px; border-radius: 5px; }
        .modal-price { color: #f85606; font-size: 20px; font-weight: bold; margin: 5px 0 15px 0; }
        .dynamic-input-box { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 14px; outline: none; margin-bottom: 15px; }
        .dynamic-input-box:focus { border-color: #f85606; }

        /* Navbar Alignment Fixes */
        .nav-links { display: flex; align-items: center; gap: 20px; } 
        .nav-links a { text-decoration: none; font-weight: bold; font-size: 15px; display: flex; align-items: center; gap: 6px; color: inherit; }
        
        #balance-link { color: #ffcc00 !important; font-weight: bold; }

        /* Profile Dropdown Menu */
        .profile-menu { position: relative; display: flex; align-items: center; }
        .profile-dropdown { display: none; position: absolute; right: 0; top: 100%; background: white; min-width: 150px; box-shadow: 0 8px 16px rgba(0,0,0,0.1); border-radius: 5px; overflow: hidden; z-index: 2000; margin-top: 15px; border: 1px solid #eee; }
        .profile-dropdown a { display: block !important; color: #333 !important; padding: 12px 15px !important; font-size: 14px !important; font-weight: normal !important; text-align: left; border-bottom: 1px solid #f1f1f1; margin: 0 !important; }
        .profile-dropdown a:hover { background-color: #f9f9f9; color: #f85606 !important; }
        .profile-dropdown.show { display: block; }
        
        .loading-products { text-align: center; width: 100%; padding: 40px 0; color: #f85606; font-size: 18px; font-weight: bold; }
    </style>
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="logo">AmarDaraz</div>
        
        <div class="search-bar">
            <input type="text" id="search-input" placeholder="Search in Daraz">
            <button id="search-btn">
                <svg style="width: 26px !important; height: 26px !important; transform: scale(1.4); display: block;" viewBox="0 0 24 24" fill="none" stroke="#f85606" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
            </button>
            <div id="search-suggestions" class="suggestions-box"></div>
        </div>

        <div class="nav-links">
            <a href="add_fund.html" id="balance-link" style="display: none;">💰 Balance: ৳ 0</a>
            <a href="profile.html">🛒 Order History</a>
            
            <div class="profile-menu" id="profile-menu-container">
                <a href="login.html" id="auth-link">Login / Signup</a>
                <div class="profile-dropdown" id="profile-dropdown">
                    <a href="profile.html">👤 Profile</a>
                    <a href="add_fund.html">💰 Add Fund</a>
                    <a href="admin.html" id="admin-menu-link" style="display: none;">⚙️ Admin Panel</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Category Navigation -->
    <div class="category-nav">
        <button class="cat-btn active" data-filter="all">All</button>
        <button class="cat-btn" data-filter="card">Card</button>
        <button class="cat-btn" data-filter="subscription">Subscription</button>
        <button class="cat-btn" data-filter="topup">Topup</button>
        <button class="cat-btn" data-filter="panel">Panel</button>
    </div>

    <!-- Main Content -->
    <div class="main-container">
        <div class="product-grid" id="dynamic-product-grid">
            <div class="loading-products">প্রোডাক্ট লোড হচ্ছে... অনুগ্রহ করে অপেক্ষা করুন।</div>
        </div>
    </div>

    <!-- 🌟 Dynamic Quick View Modal -->
    <div class="modal-overlay" id="quickViewModal">
        <div class="modal-content">
            <span class="close-btn" id="closeModal">&times;</span>
            <img src="" id="modalImg" class="modal-img">
            <h3 id="modalTitle">Product Name</h3>
            <div class="modal-price" id="modalPrice">৳ 0</div>
            
            <div id="extra-info-group" style="display: none; text-align: left;">
                <label id="extra-info-label" style="font-size: 13px; color: #555; font-weight: bold; margin-bottom: 5px; display: block;">তথ্য দিন:</label>
                <input type="text" id="extra-info-input" class="dynamic-input-box" required>
            </div>

            <button class="buy-btn" id="modalBuyBtn" style="margin-top: 5px;">Confirm & Buy Now</button>
        </div>
    </div>

    <!-- Firebase & JavaScript -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
        // 🌟 updateDoc এবং addDoc যুক্ত করা হয়েছে
        import { getFirestore, collection, getDocs, doc, getDoc, updateDoc, addDoc } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBZNrrK7MLGIZoPakMgj2yFEX7iCVYYhlg",
            authDomain: "amrdraz-d0682.firebaseapp.com",
            projectId: "amrdraz-d0682",
            storageBucket: "amrdraz-d0682.firebasestorage.app",
            messagingSenderId: "690289096145",
            appId: "1:690289096145:web:dbebaa4e60203a7922dcf0"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app); 

        const authLink = document.getElementById("auth-link");
        const balanceLink = document.getElementById("balance-link");
        const profileDropdown = document.getElementById("profile-dropdown");
        const adminMenuLink = document.getElementById("admin-menu-link");
        
        let currentUserEmail = null; // লগইন ট্র্যাক করার জন্য

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUserEmail = user.email;
                authLink.innerText = "👤 Profile ▾";
                authLink.href = "#"; 
                
                try {
                    const userDoc = await getDoc(doc(db, "users", user.email));
                    let currentBalance = 0;
                    if(userDoc.exists()) {
                        currentBalance = userDoc.data().balance || 0;
                    }
                    balanceLink.style.display = "flex";
                    balanceLink.innerText = `💰 Balance: ৳ ${currentBalance}`;
                } catch(e) { console.error("Balance fetch error:", e); }

                if(user.email === "sakibbinsalam.admin@gmail.com") {
                    adminMenuLink.style.display = "block";
                }

                authLink.onclick = function(e) {
                    e.preventDefault();
                    profileDropdown.classList.toggle("show");
                };

            } else {
                currentUserEmail = null;
                authLink.innerText = "Login / Signup";
                authLink.href = "login.html";
                authLink.onclick = null; 
                balanceLink.style.display = "none";
                profileDropdown.classList.remove("show");
                adminMenuLink.style.display = "none";
            }
        });

        let productsDatabase = [];
        const productGrid = document.getElementById("dynamic-product-grid");

        async function fetchProductsFromDB() {
            try {
                const querySnapshot = await getDocs(collection(db, "products"));
                productsDatabase = []; 
                querySnapshot.forEach((docSnap) => {
                    productsDatabase.push({ id: docSnap.id, ...docSnap.data() });
                });
                renderProducts("all"); 
            } catch (error) {
                productGrid.innerHTML = "<p style='color:red;'>প্রোডাক্ট লোড করতে সমস্যা হচ্ছে!</p>";
            }
        }
        fetchProductsFromDB();

        function renderCustomProducts(productsArray) {
            let htmlContent = "";
            if(productsArray.length === 0) {
                htmlContent = "<p style='text-align:center; width:100%; color:#777; margin-top:30px;'>দুঃখিত, কোনো প্রোডাক্ট পাওয়া যায়নি!</p>";
            } else {
                productsArray.forEach((product) => {
                    htmlContent += `
                        <div class="product-card" data-category="${product.category}">
                            <img src="${product.img}" alt="Product" class="clickable-item" onerror="this.src='https://via.placeholder.com/150?text=No+Image'">
                            <h3 class="clickable-item">${product.name}</h3>
                            <div class="product-price">৳ ${product.price}</div>
                            <button class="buy-btn clickable-item">Buy Now</button>
                        </div>
                    `;
                });
            }
            productGrid.innerHTML = htmlContent;
            attachEvents(); 
        }

        function renderProducts(filterCategory) {
            const filteredProducts = filterCategory === "all" ? productsDatabase : productsDatabase.filter(product => product.category === filterCategory);
            renderCustomProducts(filteredProducts);
        }

        document.querySelectorAll('.cat-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                renderProducts(e.target.getAttribute('data-filter'));
            });
        });

        let selectedProduct = null;
        const modal = document.getElementById('quickViewModal');

        function attachEvents() {
            document.querySelectorAll(".clickable-item").forEach(item => {
                item.addEventListener("click", function(event) {
                    const productCard = event.target.closest(".product-card");
                    
                    const name = productCard.querySelector("h3").innerText;
                    const price = productCard.querySelector(".product-price").innerText.replace("৳ ", "");
                    const img = productCard.querySelector("img").src;
                    const category = productCard.getAttribute("data-category");
                    
                    document.getElementById("modalImg").src = img;
                    document.getElementById("modalTitle").innerText = name;
                    document.getElementById("modalPrice").innerText = `৳ ${price}`;
                    
                    selectedProduct = { name, price, category };

                    const extraGroup = document.getElementById("extra-info-group");
                    const extraLabel = document.getElementById("extra-info-label");
                    const extraInput = document.getElementById("extra-info-input");

                    extraGroup.style.display = "block";
                    extraInput.value = ""; 

                    if(category === "card") {
                        extraLabel.innerText = "লিংক দিন (Link):";
                        extraInput.placeholder = "যেমন: https://...";
                    } else if(category === "subscription") {
                        extraLabel.innerText = "আপনার জিমেইল দিন (Gmail):";
                        extraInput.placeholder = "যেমন: example@gmail.com";
                    } else if(category === "topup") {
                        extraLabel.innerText = "গেমের UID দিন (Player ID):";
                        extraInput.placeholder = "যেমন: 123456789";
                    } else if(category === "panel") {
                        extraLabel.innerText = "আপনার হোয়াটসঅ্যাপ নাম্বার দিন:";
                        extraInput.placeholder = "যেমন: 01XXXXXXXXX";
                    } else {
                        extraGroup.style.display = "none"; 
                    }

                    modal.style.display = 'flex'; 
                });
            });
        }

        document.getElementById('closeModal').addEventListener('click', () => { modal.style.display = 'none'; });

        // 🌟 ডিরেক্ট ব্যালেন্স থেকে টাকা কাটার লজিক
        document.getElementById('modalBuyBtn').addEventListener('click', async () => {
            if(!selectedProduct) return;
            
            // ১. লগইন চেক
            if(!currentUserEmail) {
                alert("অর্ডার করতে হলে আপনাকে প্রথমে লগইন করতে হবে!");
                window.location.href = "login.html";
                return;
            }

            const extraGroup = document.getElementById("extra-info-group");
            const extraInput = document.getElementById("extra-info-input");
            let finalName = selectedProduct.name;

            if (extraGroup.style.display === "block") {
                if (extraInput.value.trim() === "") {
                    alert("দয়া করে বক্সে আপনার প্রয়োজনীয় তথ্যটি লিখুন!");
                    extraInput.focus();
                    return;
                }
                finalName += ` [তথ্য: ${extraInput.value.trim()}]`;
            }

            const btn = document.getElementById('modalBuyBtn');
            btn.innerText = "অর্ডার হচ্ছে...";
            btn.disabled = true;

            const productPrice = parseFloat(selectedProduct.price);

            try {
                // ২. ব্যালেন্স চেক এবং টাকা কাটা
                const userRef = doc(db, "users", currentUserEmail);
                const userSnap = await getDoc(userRef);

                if(userSnap.exists()) {
                    const currentBalance = userSnap.data().balance || 0;

                    if(currentBalance >= productPrice) {
                        // ব্যালেন্স মাইনাস করা হলো
                        const newBalance = currentBalance - productPrice;
                        await updateDoc(userRef, { balance: newBalance });

                        // ৩. অর্ডার ডাটাবেসে সেভ করা হলো
                        await addDoc(collection(db, "orders"), {
                            userEmail: currentUserEmail,
                            productName: finalName,
                            price: productPrice,
                            status: "Pending",
                            timestamp: new Date().toISOString()
                        });

                        alert("✅ আপনার অর্ডারটি সফলভাবে প্লেস হয়েছে এবং ব্যালেন্স কেটে নেওয়া হয়েছে!");
                        modal.style.display = 'none';
                        
                        // লাইভ ব্যালেন্স আপডেট
                        document.getElementById("balance-link").innerText = `💰 Balance: ৳ ${newBalance}`;
                    } else {
                        alert("❌ আপনার অ্যাকাউন্টে পর্যাপ্ত ব্যালেন্স নেই! দয়া করে ফান্ড অ্যাড করুন।");
                    }
                }
            } catch(error) {
                console.error(error);
                alert("অর্ডার করতে সমস্যা হয়েছে! ইন্টারনেট কানেকশন চেক করুন।");
            }

            btn.innerText = "Confirm & Buy Now";
            btn.disabled = false;
        });
    </script>
</body>
</html>
