<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আমার দারাজ - হোম</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="logo">AmarDaraz</div>
        <div class="search-bar">
            <input type="text" placeholder="প্রোডাক্ট খুঁজুন...">
            <button>Search</button>
        </div>
        <div class="nav-links">
            <a href="login.html" id="auth-link">Login / Signup</a>
            <a href="checkout.html">🛒 Cart (0)</a>
        </div>
    </nav>

    <!-- Banner Section -->
    <div class="banner">
        <h2>🔥 ধামাকা অফার! সব প্রোডাক্টে ২০% ছাড়! 🔥</h2>
    </div>

    <!-- Main Content -->
    <div class="main-container">
        <h2 class="section-title">Just For You</h2>
        
        <div class="product-grid">
            
            <!-- Product 1 -->
            <div class="product-card">
                <!-- আসল স্মার্টফোনের ছবি -->
                <img src="https://images.unsplash.com/photo-1598327105666-5b89351cb31b?w=300&q=80" alt="Smartphone">
                <h3>স্মার্টফোন (6GB RAM, 128GB)</h3>
                <div class="product-price">৳ ১২,৫০০</div>
                <button class="add-btn">Add to Cart</button>
            </div>
            
            <!-- Product 2 -->
            <div class="product-card">
                <!-- আসল টি-শার্টের ছবি -->
                <img src="https://images.unsplash.com/photo-1581655353564-df123a1eb820?w=300&q=80" alt="T-Shirt">
                <h3>সলিড সাদা কটন টি-শার্ট</h3>
                <div class="product-price">৳ ৩৫০</div>
                <button class="add-btn">Add to Cart</button>
            </div>
            
            <!-- Product 3 -->
            <div class="product-card">
                <!-- আসল হেডফোনের ছবি -->
                <img src="https://images.unsplash.com/photo-1618366712010-f4ae9c647dcb?w=300&q=80" alt="Headphone">
                <h3>ওয়্যারলেস ব্লুটুথ হেডফোন</h3>
                <div class="product-price">৳ ১,২০০</div>
                <button class="add-btn">Add to Cart</button>
            </div>
            
            <!-- Product 4 -->
            <div class="product-card">
                <!-- আসল স্মার্ট ওয়াচের ছবি -->
                <img src="https://images.unsplash.com/photo-1546868871-7041f2a55e12?w=300&q=80" alt="Smart Watch">
                <h3>ডিজিটাল স্মার্ট ওয়াচ (কালার ডিসপ্লে)</h3>
                <div class="product-price">৳ ৮৫০</div>
                <button class="add-btn">Add to Cart</button>
            </div>

            <!-- Product 5 (নতুন) -->
            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1525966222134-fcfa99b8ae77?w=300&q=80" alt="Sneakers">
                <h3>স্টাইলিশ স্নিকার্স জুতো</h3>
                <div class="product-price">৳ ১,৫০০</div>
                <button class="add-btn">Add to Cart</button>
            </div>

        </div>
    </div>

    <!-- Firebase Auth State Check -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBZNrrK7MLGIZoPakMgj2yFEX7iCVYYhlg",
            authDomain: "amrdraz-d0682.firebaseapp.com",
            projectId: "amrdraz-d0682",
            storageBucket: "amrdraz-d0682.firebasestorage.app",
            messagingSenderId: "690289096145",
            appId: "1:690289096145:web:dbebaa4e60203a7922dcf0"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const authLink = document.getElementById("auth-link");

        onAuthStateChanged(auth, (user) => {
            if (user) {
                authLink.innerText = "Logout";
                authLink.href = "#"; 
                authLink.addEventListener("click", (e) => {
                    e.preventDefault();
                    signOut(auth).then(() => {
                        alert("আপনি সফলভাবে লগআউট হয়েছেন!");
                        window.location.reload(); 
                    });
                });
            } else {
                authLink.innerText = "Login / Signup";
                authLink.href = "login.html";
            }
        });
    </script>
</body>
</html>
